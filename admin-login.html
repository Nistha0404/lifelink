<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Portal - LifeLink</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <header>
    <div class="logo">
      <img src="lifeLinklogoD.png" alt="LifeLink Logo" height="40">
      <span>LifeLink</span>
    </div>
    <nav>
      <a href="../index.html">Home</a>
    </nav>
  </header>

  <main>
    <section class="login-form">
      <h2>Coordinator / Admin Portal</h2>
      <div class="tabs">
        <button id="login-tab-btn" class="active" onclick="showTab('login')">Login</button>
        <button id="register-tab-btn" onclick="showTab('register')">Register</button>
      </div>

      <div id="login-tab">
        <form id="adminLoginForm">
          <div class="form-group">
            <label for="loginPhone">Phone Number</label>
            <input type="tel" id="loginPhone" placeholder="Enter your registered phone number" required>
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password" required>
          </div>
          <button type="submit" class="btn-primary">Login</button>
        </form>
      </div>

      <div id="register-tab" style="display:none;">
        <form id="adminRegisterForm">
          <div class="form-group">
            <label for="registerName">Full Name</label>
            <input type="text" id="registerName" required>
          </div>
          <div class="form-group">
            <label for="registerPincode">Pincode</label>
            <input type="text" id="registerPincode" maxlength="6" required>
          </div>
          <div class="form-group">
            <label for="registerPhone">Phone Number</label>
            <input type="tel" id="registerPhone" maxlength="10" required>
          </div>
          <div class="form-group">
            <label for="registerPassword">Create Password</label>
            <input type="password" id="registerPassword" required>
          </div>
          <button type="submit" class="btn-primary">Register</button>
        </form>
      </div>
      <p id="message" style="margin-top: 15px; font-weight: bold;"></p>
    </section>
  </main>
  
  <script>
    const loginForm = document.getElementById("adminLoginForm");
    const registerForm = document.getElementById("adminRegisterForm");
    const messageEl = document.getElementById("message");

    function showTab(tabName) {
      document.getElementById('login-tab').style.display = tabName === 'login' ? 'block' : 'none';
      document.getElementById('register-tab').style.display = tabName === 'register' ? 'block' : 'none';
      document.getElementById('login-tab-btn').classList.toggle('active', tabName === 'login');
      document.getElementById('register-tab-btn').classList.toggle('active', tabName === 'register');
      messageEl.textContent = '';
    }

    // --- Registration Logic ---
    registerForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        const fullName = document.getElementById("registerName").value;
        const pincode = document.getElementById("registerPincode").value;
        const phoneNumber = document.getElementById("registerPhone").value;
        const password = document.getElementById("registerPassword").value;

        try {
            // --- CHANGED THIS LINE ---
            const response = await fetch('/api/server/register/admin', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ fullName, pincode, phoneNumber, password })
            });
            const result = await response.json();

            if (result.success) {
                messageEl.style.color = 'var(--success-color)';
                messageEl.textContent = `${result.message} You can now log in.`;
                showTab('login');
            } else {
                messageEl.style.color = 'var(--error-color)';
                messageEl.textContent = `Registration failed: ${result.message}`;
            }
        } catch (error) {
            console.error('Registration error:', error);
            messageEl.style.color = 'var(--error-color)';
            messageEl.textContent = 'Could not connect to the server. Please try again.';
        }
    });

    // --- Login Logic ---
    loginForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        const phoneNumber = document.getElementById("loginPhone").value;
        const password = document.getElementById("password").value;

        try {
            // --- CHANGED THIS LINE ---
            const response = await fetch('/api/server/login/admin', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phoneNumber, password })
            });
            const result = await response.json();

            if (result.success) {
                sessionStorage.setItem('currentAdminName', result.user.fullName);
                messageEl.style.color = 'var(--success-color)';
                messageEl.textContent = 'Login successful! Redirecting...';
                setTimeout(() => {
                    window.location.href = "admin-dashboard.html";
                }, 1500);
            } else {
                messageEl.style.color = 'var(--error-color)';
                messageEl.textContent = `Login failed: ${result.message}`;
            }
        } catch (error) {
            console.error('Login error:', error);
            messageEl.style.color = 'var(--error-color)';
            messageEl.textContent = 'Could not connect to the server. Please try again.';
        }
    });
  </script>
</body>
</html>
