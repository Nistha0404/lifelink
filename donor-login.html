<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Donor Portal - LifeLink</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <header>
    <div class="logo">
      <img src="../logo.jpeg" alt="LifeLink Logo">
      <span>LifeLink</span>
    </div>
    <nav>
      <a href="../index.html">Home</a>
    </nav>
  </header>
  <main>
    <section class="main-card" id="auth-section">
      <h2>Donor Portal</h2>
      <div class="tabs">
        <button id="login-tab-btn" class="active" onclick="showTab('login')">Login</button>
        <button id="register-tab-btn" onclick="showTab('register')">Register</button>
      </div>

      <div id="login-tab">
        <form id="donorLoginForm">
          <div class="form-group">
            <label for="loginPhone">Phone Number</label>
            <input type="tel" id="loginPhone" placeholder="Enter 10-digit number" required>
          </div>
          <button type="button" class="btn-primary" onclick="generateLoginOtp()">Generate OTP</button>
          <div class="form-group" id="loginOtpGroup" style="display:none;">
            <label for="loginOtp">OTP</label>
            <input type="text" id="loginOtp" placeholder="Enter 6-digit OTP" required>
            <button type="submit" class="btn-primary">Login</button>
          </div>
        </form>
      </div>

      <div id="register-tab" style="display:none;">
        <form id="donorRegisterForm">
          <div class="form-group"><label for="regName">Full Name</label><input type="text" id="regName" required></div>
          <div class="form-group">
            <label for="regBloodType">Blood Type</label>
            <select id="regBloodType" required>
                <option value="" disabled selected>Select your blood type</option>
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>
            </select>
          </div>
          <div class="form-group"><label for="regPincode">Pincode</label><input type="text" id="regPincode" required></div>
          <div class="form-group"><label for="regAddress">Address</label><input type="text" id="regAddress" required></div>
          <div class="form-group"><label for="regPhone">Phone Number</label><input type="tel" id="regPhone" required></div>
          <input type="hidden" id="latitude"><input type="hidden" id="longitude">
          <button type="button" class="btn-secondary" onclick="getGeolocation()">Grant Geolocation Permission</button>
          <button type="button" class="btn-primary" onclick="generateRegisterOtp()">Register</button>
          
          <div class="form-group" id="registerOtpGroup" style="display:none;">
            <label for="registerOtp">OTP</label>
            <input type="text" id="registerOtp" placeholder="Enter 6-digit OTP" required>
            <button type="submit" class="btn-primary">Confirm Registration</button>
          </div>
        </form>
      </div>
      <p id="message" class="message-area"></p>
    </section>
  </main>

  <script>
    const messageEl = document.getElementById('message');

    function showTab(tabName) {
      document.getElementById('login-tab').style.display = 'none';
      document.getElementById('register-tab').style.display = 'none';
      document.querySelector('.tabs button.active').classList.remove('active');
      document.getElementById(`${tabName}-tab`).style.display = 'block';
      document.getElementById(`${tabName}-tab-btn`).classList.add('active');
      messageEl.textContent = '';
    }

    function getGeolocation() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(position => {
                document.getElementById('latitude').value = position.coords.latitude;
                document.getElementById('longitude').value = position.coords.longitude;
                messageEl.textContent = 'Geolocation captured successfully!';
                messageEl.className = 'message-success';
            }, () => {
                messageEl.textContent = 'Geolocation permission denied. Please enter details manually.';
                messageEl.className = 'message-error';
            });
        } else {
            messageEl.textContent = 'Geolocation is not supported by this browser.';
        }
    }

    async function generateLoginOtp() {
        const phoneNumber = document.getElementById('loginPhone').value;
        if (!phoneNumber) { messageEl.textContent = 'Please enter a phone number.'; return; }

        const response = await fetch('/api/donor/generate-otp', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phoneNumber })
        });
        const result = await response.json();
        messageEl.textContent = result.message;
        if (result.success) {
            alert(`Your OTP is: ${result.otp}`); // Display OTP
            document.getElementById('loginOtpGroup').style.display = 'block';
        } else {
             messageEl.className = 'message-error';
        }
    }

    document.getElementById('donorLoginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const payload = {
            phoneNumber: document.getElementById('loginPhone').value,
            otp: document.getElementById('loginOtp').value
        };
        const response = await fetch('/api/donor/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        const result = await response.json();
        if (result.success) {
            sessionStorage.setItem('donorInfo', JSON.stringify(result.user));
            window.location.href = './donor-dashboard.html';
        } else {
            messageEl.textContent = `Login failed: ${result.message}`;
            messageEl.className = 'message-error';
        }
    });
    
    async function generateRegisterOtp() {
        const form = document.getElementById('donorRegisterForm');
        if (!form.checkValidity()) {
            messageEl.textContent = 'Please fill out all required fields.';
            return;
        }
        const phoneNumber = document.getElementById('regPhone').value;
        const response = await fetch('/api/donor/register-request', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phoneNumber })
        });
        const result = await response.json();
        messageEl.textContent = result.message;
        if (result.success) {
            alert(`Your registration OTP is: ${result.otp}`);
            document.getElementById('registerOtpGroup').style.display = 'block';
        }
    }

    document.getElementById('donorRegisterForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const payload = {
            fullName: document.getElementById('regName').value,
            bloodType: document.getElementById('regBloodType').value, // <-- CAPTURE BLOOD TYPE
            pincode: document.getElementById('regPincode').value,
            address: document.getElementById('regAddress').value,
            phoneNumber: document.getElementById('regPhone').value,
            latitude: document.getElementById('latitude').value,
            longitude: document.getElementById('longitude').value,
            otp: document.getElementById('registerOtp').value
        };
        const response = await fetch('/api/donor/register-confirm', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        const result = await response.json();
        messageEl.textContent = result.message;
        if (result.success) {
            alert('Registered successfully! Please login.');
            setTimeout(() => showTab('login'), 2000);
        } else {
             messageEl.className = 'message-error';
        }
    });
  </script>
</body>
</html>
