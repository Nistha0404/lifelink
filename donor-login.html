<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Donor Portal - LifeLink</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <header>
    <div class="logo">
      <img src="../logo.jpeg" alt="LifeLink Logo">
      <span>LifeLink</span>
    </div>
    <nav>
      <a href="../index.html">Home</a>
    </nav>
  </header>
  <main>
    <section class="main-card" id="auth-section">
      <h2>Donor Portal</h2>
      <div class="tabs">
        <button id="login-tab-btn" class="active" onclick="showTab('login')">Login</button>
        <button id="register-tab-btn" onclick="showTab('register')">Register</button>
      </div>

      <!-- Login Tab with OTP -->
      <div id="login-tab">
        <form id="donorLoginForm" onsubmit="handleLogin(event)">
          <div class="form-group">
            <label for="loginPhone">Phone Number</label>
            <input type="tel" id="loginPhone" placeholder="Enter 10-digit number">
          </div>
          <button type="button" class="btn-primary" onclick="generateLoginOtp()">Generate OTP</button>
          <div class="form-group" id="loginOtpGroup" style="display:none;">
            <label for="loginOtp">OTP</label>
            <input type="text" id="loginOtp" placeholder="Enter 6-digit OTP">
            <button type="submit" class="btn-primary">Login</button>
          </div>
        </form>
      </div>

      <!-- Register Tab with OTP -->
      <div id="register-tab" style="display:none;">
        <form id="donorRegisterForm" onsubmit="handleRegistration(event)">
          <div class="form-group"><label for="regName">Full Name</label><input type="text" id="regName"></div>
          <div class="form-group"><label for="regPhone">Phone Number</label><input type="tel" id="regPhone"></div>
          <div class="form-group">
            <label for="regBloodType">Blood Type</label>
            <input type="text" id="regBloodType" name="bloodType" placeholder="e.g., A+, o-, ab+">
          </div>
          <div class="form-group"><label for="regPincode">Pincode</label><input type="text" id="regPincode"></div>
          <button type="button" class="btn-primary" onclick="generateRegisterOtp()">Register</button>
          
          <div class="form-group" id="registerOtpGroup" style="display:none;">
            <label for="registerOtp">OTP</label>
            <input type="text" id="registerOtp" placeholder="Enter 6-digit OTP">
            <button type="submit" class="btn-primary">Confirm Registration</button>
          </div>
        </form>
      </div>
      <p id="message" class="message-area"></p>
    </section>
  </main>

  <script>
    const messageEl = document.getElementById('message');

    function showTab(tabName) {
      document.getElementById('login-tab').style.display = 'none';
      document.getElementById('register-tab').style.display = 'none';
      document.querySelector('.tabs button.active').classList.remove('active');
      document.getElementById(`${tabName}-tab`).style.display = 'block';
      document.getElementById(`${tabName}-tab-btn`).classList.add('active');
      messageEl.textContent = '';
      messageEl.className = 'message-area';
    }

    // --- LOGIN FUNCTIONS ---
    async function generateLoginOtp() {
      const phoneNumber = document.getElementById('loginPhone').value.trim();
      if (!phoneNumber) {
          messageEl.textContent = 'Please enter your phone number.';
          return;
      }
      messageEl.textContent = 'Generating OTP...';
      const response = await fetch('/api/server/donor/generate-otp', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ phoneNumber })
      });
      const result = await response.json();
      messageEl.textContent = result.message;
      if (result.success) {
          messageEl.className = 'message-area message-success';
          alert(`Your Login OTP is: ${result.otp}`);
          document.getElementById('loginOtpGroup').style.display = 'block';
      } else {
          messageEl.className = 'message-area message-error';
      }
    }

    async function handleLogin(event) {
        event.preventDefault();
        const phoneNumber = document.getElementById('loginPhone').value.trim();
        const otp = document.getElementById('loginOtp').value.trim();
        if(!phoneNumber || !otp) {
            messageEl.textContent = 'Please enter phone number and OTP.';
            return;
        }
        const response = await fetch('/api/server/donor/login', {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ phoneNumber, otp })
        });
        const result = await response.json();
        if (result.success) {
            alert('Login Successful!');
            sessionStorage.setItem('donorInfo', JSON.stringify(result.user));
            window.location.href = './donor-dashboard.html';
        } else {
            messageEl.textContent = result.message;
            messageEl.className = 'message-area message-error';
        }
    }
    
    // --- REGISTRATION FUNCTIONS (MANUAL VALIDATION) ---
    async function generateRegisterOtp() {
        messageEl.className = 'message-area message-error'; // Default to error style for messages
        const fullName = document.getElementById('regName').value.trim();
        const phoneNumber = document.getElementById('regPhone').value.trim();
        const bloodTypeInput = document.getElementById('regBloodType');
        const bloodTypeValue = bloodTypeInput.value.trim();

        // Step-by-step manual validation
        if (!fullName) {
            messageEl.textContent = 'Please enter your full name.';
            return;
        }
        if (!phoneNumber) {
            messageEl.textContent = 'Please enter your phone number.';
            return;
        }
        if (!bloodTypeValue) {
            messageEl.textContent = 'Please enter your blood type.';
            return;
        }

        // Custom blood type format validation (now case-insensitive)
        const validBloodTypeRegex = /^(A|B|AB|O)[+-]$/i;
        if (!validBloodTypeRegex.test(bloodTypeValue)) {
            messageEl.textContent = 'Invalid Blood Type. Please use format like A+, o-, or AB+.';
            return;
        }

        // If all checks pass, proceed with OTP generation
        messageEl.textContent = 'Requesting OTP...';
        messageEl.className = 'message-area';
        const response = await fetch('/api/server/donor/register-request', {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ phoneNumber })
        });
        const result = await response.json();
        messageEl.textContent = result.message;
        if (result.success) {
            messageEl.className = 'message-area message-success';
            alert(`Your Registration OTP is: ${result.otp}`);
            document.getElementById('registerOtpGroup').style.display = 'block';
        } else {
            messageEl.className = 'message-area message-error';
        }
    }

    async function handleRegistration(event) {
        event.preventDefault();
        const otp = document.getElementById('registerOtp').value.trim();
        if (!otp) {
            messageEl.textContent = 'Please enter the OTP you received.';
            messageEl.className = 'message-area message-error';
            return;
        }
        
        const bloodTypeValue = document.getElementById('regBloodType').value.trim().toUpperCase();

        const payload = {
            fullName: document.getElementById('regName').value.trim(),
            phoneNumber: document.getElementById('regPhone').value.trim(),
            pincode: document.getElementById('regPincode').value.trim(),
            bloodType: bloodTypeValue,
            otp: otp
        };

        const response = await fetch('/api/server/donor/register-confirm', {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
        });
        const result = await response.json();
        messageEl.textContent = result.message;
        if (result.success) {
            messageEl.className = 'message-area message-success';
            alert('Registered successfully! Please switch to the Login tab.');
            setTimeout(() => showTab('login'), 2000);
        } else {
            messageEl.className = 'message-area message-error';
        }
    }
  </script>
</body>
</html>
