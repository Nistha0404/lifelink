<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donor Portal - LifeLink</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    
    <style>
        .auth-page {
            min-height: 100vh;
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: var(--neutral-50);
        }
        
        .auth-sidebar {
            background: var(--gradient-primary);
            padding: var(--space-12);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            color: white;
            position: relative;
            overflow: hidden;
        }
        
        .auth-sidebar::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
            pointer-events: none;
        }
        
        .auth-sidebar-content {
            position: relative;
            z-index: 1;
        }
        
        .auth-sidebar h2 {
            font-size: var(--text-4xl);
            color: white;
            margin-bottom: var(--space-4);
        }
        
        .auth-sidebar p {
            font-size: var(--text-lg);
            color: rgba(255, 255, 255, 0.9);
            line-height: var(--leading-relaxed);
        }

        .auth-logo {
            display: flex;
            align-items: center;
            gap: var(--space-3);
            font-size: var(--text-2xl);
            font-weight: var(--font-bold);
            color: var(--primary-600);
            margin-bottom: var(--space-8);
            text-decoration: none;
        }

        .auth-logo img {
            height: 40px;
            width: auto;
        }
        
        .auth-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: var(--space-6);
            margin-top: var(--space-8);
        }
        
        .auth-stat {
            text-align: center;
        }
        
        .auth-stat-number {
            font-size: var(--text-3xl);
            font-weight: var(--font-bold);
            color: white;
            margin-bottom: var(--space-2);
        }
        
        .auth-stat-label {
            font-size: var(--text-sm);
            color: rgba(255, 255, 255, 0.8);
        }
        
        .auth-content {
            padding: var(--space-12);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .auth-header {
            margin-bottom: var(--space-8);
        }
        
        .auth-title {
            font-size: var(--text-3xl);
            margin-bottom: var(--space-3);
        }
        
        .auth-subtitle {
            color: var(--neutral-600);
            font-size: var(--text-base);
        }
        
        .auth-tabs {
            display: flex;
            gap: var(--space-2);
            background: var(--neutral-100);
            padding: var(--space-1);
            border-radius: var(--radius-lg);
            margin-bottom: var(--space-8);
        }
        
        .auth-tab {
            flex: 1;
            padding: var(--space-3) var(--space-4);
            background: transparent;
            border: none;
            border-radius: var(--radius-md);
            font-size: var(--text-sm);
            font-weight: var(--font-medium);
            color: var(--neutral-600);
            cursor: pointer;
            transition: all var(--transition-fast);
        }
        
        .auth-tab.active {
            background: white;
            color: var(--primary-600);
            box-shadow: var(--shadow-sm);
        }
        
        .auth-form {
            max-width: 400px;
        }
        
        .auth-footer {
            margin-top: var(--space-6);
            text-align: center;
            font-size: var(--text-sm);
            color: var(--neutral-600);
        }
        
        .auth-footer a {
            color: var(--primary-600);
            font-weight: var(--font-medium);
        }
        
        .message-success {
            padding: var(--space-4);
            background: var(--success-light);
            color: var(--success);
            border-radius: var(--radius-lg);
            margin-bottom: var(--space-4);
            border: 1px solid var(--success);
        }
        
        .message-error {
            padding: var(--space-4);
            background: var(--error-light);
            color: var(--error);
            border-radius: var(--radius-lg);
            margin-bottom: var(--space-4);
            border: 1px solid var(--error);
        }

        .resend-otp-btn {
            margin-top: var(--space-3);
            font-size: var(--text-sm);
            color: var(--primary-600);
            background: none;
            border: none;
            cursor: pointer;
            text-decoration: underline;
            padding: 0;
            display: block;
        }
        .resend-otp-btn:hover {
            color: var(--primary-700);
        }
        .resend-otp-btn:disabled {
            color: var(--neutral-400);
            cursor: not-allowed;
        }
        
        @media (max-width: 1024px) {
            .auth-page {
                grid-template-columns: 1fr;
            }
            
            .auth-sidebar {
                display: none;
            }
            
            .auth-content {
                padding: var(--space-8) var(--space-6);
            }
        }
    </style>
</head>
<body>
    <div class="auth-page">
        <div class="auth-sidebar">
            <div class="auth-sidebar-content">
                <a href="index.html" class="auth-logo" style="color: white;">
                    <img src="lifeLinklogoD.png" alt="LifeLink Logo" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2240%22 height=%2240%22><circle cx=%2220%22 cy=%2220%22 r=%2218%22 fill=%22white%22 opacity=%220.2%22/><path d=%22M20 8v12M14 14h12%22 stroke=%22white%22 stroke-width=%223%22 stroke-linecap=%22round%22/></svg>'">
                    <span>LifeLink</span>
                </a>
                
                <h2>Give the Gift of Life</h2>
                <p>
                    Join our community of donors making a real difference. Your donation can save up to three lives.
                </p>
                
                <div class="auth-stats">
                    <div class="auth-stat">
                        <div class="auth-stat-number">1000+</div>
                        <div class="auth-stat-label">Lives Saved</div>
                    </div>
                    <div class="auth-stat">
                        <div class="auth-stat-number">500+</div>
                        <div class="auth-stat-label">Donors</div>
                    </div>
                    <div class="auth-stat">
                        <div class="auth-stat-number">20+</div>
                        <div class="auth-stat-label">Hospitals</div>
                    </div>
                </div>
            </div>
            
            <p style="font-size: var(--text-sm); opacity: 0.8;">
                © 2025 LifeLink. All rights reserved.
            </p>
        </div>
        
        <div class="auth-content">
            <div class="auth-header">
                <a href="index.html" class="auth-logo">
                    <img src="lifeLinklogoD.png" alt="LifeLink Logo" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2240%22 height=%2240%22><circle cx=%2220%22 cy=%2220%22 r=%2218%22 fill=%22%23f43f5e%22/><path d=%22M20 8v12M14 14h12%22 stroke=%22white%22 stroke-width=%223%22 stroke-linecap=%22round%22/></svg>'">
                    <span>LifeLink</span>
                </a>
                
                <h1 class="auth-title">Donor Portal</h1>
                <p class="auth-subtitle">Sign in to your account or create a new one</p>
            </div>
            
            <div class="auth-tabs">
                <button class="auth-tab active" id="login-tab-btn" onclick="showTab('login')">Login</button>
                <button class="auth-tab" id="register-tab-btn" onclick="showTab('register')">Register</button>
            </div>
            
            <div id="login-tab" class="auth-form">
                <form id="donorLoginForm">
                    <div class="form-group">
                        <label class="form-label" for="loginPhone">
                            Phone Number <span class="required">*</span>
                        </label>
                        <input 
                            type="tel" 
                            id="loginPhone" 
                            class="form-input" 
                            placeholder="Enter your 10-digit number"
                            maxlength="10"
                            required
                        >
                    </div>
                    
                    <button type="button" id="loginOtpBtn" class="btn btn-primary" style="width: 100%; margin-bottom: var(--space-4);">
                        Get OTP
                    </button>
                    
                    <div id="loginOtpGroup" style="display: none;">
                        <div class="form-group">
                            <label class="form-label" for="loginOtp">
                                Enter OTP <span class="required">*</span>
                            </label>
                            <input 
                                type="text" 
                                id="loginOtp" 
                                class="form-input" 
                                placeholder="Enter 4-digit OTP"
                                maxlength="4"
                                inputmode="numeric"
                            >
                        </div>
                        
                        <button type="submit" class="btn btn-primary" style="width: 100%;">
                            Login
                        </button>
                        <button type="button" id="loginResendBtn" class="resend-otp-btn">Resend OTP</button>
                    </div>
                </form>
            </div>
            
            <div id="register-tab" class="auth-form" style="display: none;">
                <form id="donorRegisterForm">
                    <div class="form-group">
                        <label class="form-label" for="regName">
                            Full Name <span class="required">*</span>
                        </label>
                        <input 
                            type="text" 
                            id="regName" 
                            class="form-input" 
                            placeholder="Enter your full name"
                            required
                        >
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="regPhone">
                            Phone Number <span class="required">*</span>
                        </label>
                        <input 
                            type="tel" 
                            id="regPhone" 
                            class="form-input" 
                            placeholder="10-digit mobile number"
                            maxlength="10"
                            required
                        >
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="regBloodType">
                            Blood Type <span class="required">*</span>
                        </label>
                        <select id="regBloodType" class="form-select" required>
                            <option value="" disabled selected>Select your blood type</option>
                            <option value="A+">A+</option>
                            <option value="A-">A-</option>
                            <option value="B+">B+</option>
                            <option value="B-">B-</option>
                            <option value="AB+">AB+</option>
                            <option value="AB-">AB-</option>
                            <option value="O+">O+</option>
                            <option value="O-">O-</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="regPincode">
                            Pincode <span class="required">*</span>
                        </label>
                        <input 
                            type="text" 
                            id="regPincode" 
                            class="form-input" 
                            placeholder="Your 6-digit area pincode"
                            maxlength="6"
                            inputmode="numeric"
                            required
                        >
                    </div>
                    
                    <button type="button" id="registerOtpBtn" class="btn btn-primary" style="width: 100%; margin-bottom: var(--space-4);">
                        Register & Get OTP
                    </button>
                    
                    <div id="registerOtpGroup" style="display: none;">
                        <div class="form-group">
                            <label class="form-label" for="registerOtp">
                                Enter OTP <span class="required">*</span>
                            </label>
                            <input 
                                type="text" 
                                id="registerOtp" 
                                class="form-input" 
                                placeholder="Enter 4-digit OTP"
                                maxlength="4"
                                inputmode="numeric"
                            >
                        </div>
                        
                        <button type="submit" class="btn btn-primary" style="width: 100%;">
                            Confirm Registration
                        </button>
                        <button type="button" id="registerResendBtn" class="resend-otp-btn">Resend OTP</button>
                    </div>
                </form>
            </div>
            
            <div id="message" class="mt-4"></div>
            
            <div class="auth-footer">
                <p>
                    <a href="index.html">← Back to Home</a>
                </p>
            </div>
        </div>
    </div>
    
    <script>
        const loginForm = document.getElementById("donorLoginForm");
        const registerForm = document.getElementById("donorRegisterForm");
        const messageEl = document.getElementById("message");

        const loginPhoneInput = document.getElementById("loginPhone");
        const loginOtpBtn = document.getElementById("loginOtpBtn");
        const loginOtpGroup = document.getElementById("loginOtpGroup");
        const loginResendBtn = document.getElementById("loginResendBtn");

        const regNameInput = document.getElementById("regName");
        const regPhoneInput = document.getElementById("regPhone");
        const regBloodTypeInput = document.getElementById("regBloodType");
        const regPincodeInput = document.getElementById("regPincode");
        const registerOtpBtn = document.getElementById("registerOtpBtn");
        const registerOtpGroup = document.getElementById("registerOtpGroup");
        const registerResendBtn = document.getElementById("registerResendBtn");

        function showTab(tabName) {
            document.getElementById('login-tab').style.display = tabName === 'login' ? 'block' : 'none';
            document.getElementById('register-tab').style.display = tabName === 'register' ? 'block' : 'none';
            document.getElementById('login-tab-btn').classList.toggle('active', tabName === 'login');
            document.getElementById('register-tab-btn').classList.toggle('active', tabName === 'register');
            
            // Hide message and OTP groups
            messageEl.style.display = 'none';
            messageEl.className = '';
            loginOtpGroup.style.display = 'none';
            registerOtpGroup.style.display = 'none';
        }

        function showMessage(text, type) {
            messageEl.textContent = text;
            messageEl.className = type === 'success' ? 'message-success' : 'message-error';
            messageEl.style.display = 'block';
        }

        function isValidPhone(phone) {
            return /^\d{10}$/.test(phone);
        }

        function isValidPincode(pincode) {
            return /^\d{6}$/.test(pincode);
        }

        // ========== LOGIN OTP ==========
        loginOtpBtn.addEventListener('click', async () => {
            const phoneNumber = loginPhoneInput.value.trim();
            if (!isValidPhone(phoneNumber)) {
                showMessage('Please enter a valid 10-digit phone number', 'error');
                return;
            }

            loginOtpBtn.disabled = true;
            loginOtpBtn.textContent = 'Sending OTP...';

            try {
                const response = await fetch('/api/server/donor/send-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phoneNumber })
                });
                
                const result = await response.json();

                if (result.success) {
                    // Show OTP in alert popup
                    alert(`📱 Your OTP is: ${result.otp}\n\n(In production, this will be sent via SMS)`);
                    showMessage('OTP sent! Check the popup alert.', 'success');
                    loginOtpGroup.style.display = 'block';
                    loginPhoneInput.disabled = true;
                    loginOtpBtn.style.display = 'none';
                } else {
                    showMessage(`Error: ${result.message}`, 'error');
                    loginOtpBtn.disabled = false;
                    loginOtpBtn.textContent = 'Get OTP';
                }
            } catch (error) {
                showMessage('Could not connect to the server. Please try again.', 'error');
                loginOtpBtn.disabled = false;
                loginOtpBtn.textContent = 'Get OTP';
            }
        });

        // Login Resend OTP
        loginResendBtn.addEventListener('click', async () => {
            const phoneNumber = loginPhoneInput.value.trim();
            loginResendBtn.disabled = true;
            loginResendBtn.textContent = 'Resending...';

            try {
                const response = await fetch('/api/server/donor/send-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phoneNumber })
                });
                
                const result = await response.json();

                if (result.success) {
                    alert(`📱 Your OTP is: ${result.otp}\n\n(In production, this will be sent via SMS)`);
                    showMessage('OTP resent! Check the popup alert.', 'success');
                    loginResendBtn.disabled = false;
                    loginResendBtn.textContent = 'Resend OTP';
                } else {
                    showMessage(`Error: ${result.message}`, 'error');
                    loginResendBtn.disabled = false;
                    loginResendBtn.textContent = 'Resend OTP';
                }
            } catch (error) {
                showMessage('Could not connect to the server.', 'error');
                loginResendBtn.disabled = false;
                loginResendBtn.textContent = 'Resend OTP';
            }
        });

        // ========== LOGIN FORM SUBMIT ==========
        loginForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            const phoneNumber = loginPhoneInput.value.trim();
            const otp = document.getElementById('loginOtp').value.trim();

            if (otp.length !== 4) {
                showMessage('Please enter the 4-digit OTP.', 'error');
                return;
            }

            const submitBtn = loginForm.querySelector('button[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Logging in...';

            try {
                const response = await fetch('/api/server/donor-login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phoneNumber, otp, fullName: '', bloodType: '', pincode: '' })
                });

                const result = await response.json();

                if (result.success) {
                    sessionStorage.setItem('currentUser', JSON.stringify(result.user));
                    showMessage('Login successful! Redirecting...', 'success');
                    setTimeout(() => {
                        window.location.href = "donor-dashboard.html";
                    }, 1500);
                } else {
                    showMessage(`Login failed: ${result.message}`, 'error');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Login';
                }
            } catch (error) {
                showMessage('Could not connect to the server. Please try again.', 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Login';
            }
        });

        // ========== REGISTER OTP ==========
        registerOtpBtn.addEventListener('click', async () => {
            const fullName = regNameInput.value.trim();
            const phoneNumber = regPhoneInput.value.trim();
            const bloodType = regBloodTypeInput.value;
            const pincode = regPincodeInput.value.trim();

            if (!fullName || !bloodType) {
                showMessage('Please fill in all required fields.', 'error');
                return;
            }
            if (!isValidPhone(phoneNumber)) {
                showMessage('Please enter a valid 10-digit phone number', 'error');
                return;
            }
            if (!isValidPincode(pincode)) {
                showMessage('Please enter a valid 6-digit pincode', 'error');
                return;
            }

            registerOtpBtn.disabled = true;
            registerOtpBtn.textContent = 'Sending OTP...';

            try {
                const response = await fetch('/api/server/donor/send-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phoneNumber })
                });

                const result = await response.json();

                if (result.success) {
                    alert(`📱 Your OTP is: ${result.otp}\n\n(In production, this will be sent via SMS)`);
                    showMessage('OTP sent! Check the popup alert. Please verify to complete registration.', 'success');
                    registerOtpGroup.style.display = 'block';
                    regNameInput.disabled = true;
                    regPhoneInput.disabled = true;
                    regBloodTypeInput.disabled = true;
                    regPincodeInput.disabled = true;
                    registerOtpBtn.style.display = 'none';
                } else {
                    showMessage(`Error: ${result.message}`, 'error');
                    registerOtpBtn.disabled = false;
                    registerOtpBtn.textContent = 'Register & Get OTP';
                }
            } catch (error) {
                showMessage('Could not connect to the server. Please try again.', 'error');
                registerOtpBtn.disabled = false;
                registerOtpBtn.textContent = 'Register & Get OTP';
            }
        });

        // Register Resend OTP
        registerResendBtn.addEventListener('click', async () => {
            const phoneNumber = regPhoneInput.value.trim();
            registerResendBtn.disabled = true;
            registerResendBtn.textContent = 'Resending...';

            try {
                const response = await fetch('/api/server/donor/send-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phoneNumber })
                });
                
                const result = await response.json();

                if (result.success) {
                    alert(`📱 Your OTP is: ${result.otp}\n\n(In production, this will be sent via SMS)`);
                    showMessage('OTP resent! Check the popup alert.', 'success');
                    registerResendBtn.disabled = false;
                    registerResendBtn.textContent = 'Resend OTP';
                } else {
                    showMessage(`Error: ${result.message}`, 'error');
                    registerResendBtn.disabled = false;
                    registerResendBtn.textContent = 'Resend OTP';
                }
            } catch (error) {
                showMessage('Could not connect to the server.', 'error');
                registerResendBtn.disabled = false;
                registerResendBtn.textContent = 'Resend OTP';
            }
        });

        // ========== REGISTER FORM SUBMIT ==========
        registerForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            const otp = document.getElementById('registerOtp').value.trim();
            
            const fullName = regNameInput.value.trim();
            const phoneNumber = regPhoneInput.value.trim();
            const bloodType = regBloodTypeInput.value;
            const pincode = regPincodeInput.value.trim();

            if (otp.length !== 4) {
                showMessage('Please enter the 4-digit OTP.', 'error');
                return;
            }

            const submitBtn = registerForm.querySelector('button[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Confirming...';

            try {
                const response = await fetch('/api/server/donor-login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fullName, phoneNumber, bloodType, pincode, otp })
                });
                
                const result = await response.json();

                if (result.success) {
                    showMessage('Registration successful! You can now log in.', 'success');
                    setTimeout(() => {
                        registerForm.reset();
                        regNameInput.disabled = false;
                        regPhoneInput.disabled = false;
                        regBloodTypeInput.disabled = false;
                        regPincodeInput.disabled = false;
                        registerOtpBtn.style.display = 'block';
                        registerOtpBtn.disabled = false;
                        registerOtpBtn.textContent = 'Register & Get OTP';
                        registerOtpGroup.style.display = 'none';
                        
                        showTab('login');
                    }, 2000);
                } else {
                    showMessage(`Registration failed: ${result.message}`, 'error');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Confirm Registration';
                }
            } catch (error) {
                showMessage('Could not connect to the server. Please try again.', 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Confirm Registration';
            }
        });

    </script>
</body>
</html>
