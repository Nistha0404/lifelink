<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Donor Portal - LifeLink</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    /* You can remove the button styles if they are no longer used elsewhere */
    .button-group { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.5rem; }
    .btn-outline { background-color: #fff; border: 1px solid #ccc; padding: 0.5rem 1rem; border-radius: 20px; cursor: pointer; font-size: 0.9rem; transition: all 0.2s ease-in-out; }
    .btn-outline.active { background-color: #c8102e; color: #fff; border-color: #c8102e; font-weight: bold; }
    .btn-outline:hover { background-color: #f1f1f1; }
    .btn-outline.active:hover { background-color: #a80d26; }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <img src="../logo.jpeg" alt="LifeLink Logo">
      <span>LifeLink</span>
    </div>
    <nav>
      <a href="../index.html">Home</a>
    </nav>
  </header>
  <main>
    <section class="main-card" id="auth-section">
      <h2>Donor Portal</h2>
      <div class="tabs">
        <button id="login-tab-btn" class="active" onclick="showTab('login')">Login</button>
        <button id="register-tab-btn" onclick="showTab('register')">Register</button>
      </div>

      <!-- Login Tab with OTP -->
      <div id="login-tab">
        <form id="donorLoginForm" onsubmit="handleLogin(event)">
          <div class="form-group">
            <label for="loginPhone">Phone Number</label>
            <input type="tel" id="loginPhone" placeholder="Enter 10-digit number" required>
          </div>
          <button type="button" class="btn-primary" onclick="generateLoginOtp()">Generate OTP</button>
          <div class="form-group" id="loginOtpGroup" style="display:none;">
            <label for="loginOtp">OTP</label>
            <input type="text" id="loginOtp" placeholder="Enter 6-digit OTP" required>
            <button type="submit" class="btn-primary">Login</button>
          </div>
        </form>
      </div>

      <!-- Register Tab with OTP -->
      <div id="register-tab" style="display:none;">
        <form id="donorRegisterForm" onsubmit="handleRegistration(event)">
          <div class="form-group"><label for="regName">Full Name</label><input type="text" id="regName" required></div>
          <div class="form-group"><label for="regPhone">Phone Number</label><input type="tel" id="regPhone" required></div>
          
          <!-- =================== NEW TEXT INPUT FOR BLOOD TYPE =================== -->
          <div class="form-group">
            <label for="regBloodType">Blood Type</label>
            <input type="text" id="regBloodType" name="bloodType" placeholder="e.g., A+, o-, ab+" required>
          </div>
          <!-- ======================= END OF NEW INPUT ======================= -->
          
          <div class="form-group"><label for="regPincode">Pincode</label><input type="text" id="regPincode"></div>
          <button type="button" class="btn-primary" onclick="generateRegisterOtp()">Register</button>
          
          <div class="form-group" id="registerOtpGroup" style="display:none;">
            <label for="registerOtp">OTP</label>
            <input type="text" id="registerOtp" placeholder="Enter 6-digit OTP" required>
            <button type="submit" class="btn-primary">Confirm Registration</button>
          </div>
        </form>
      </div>
      <p id="message" class="message-area"></p>
    </section>
  </main>

  <script>
    const messageEl = document.getElementById('message');

    function showTab(tabName) {
      document.getElementById('login-tab').style.display = 'none';
      document.getElementById('register-tab').style.display = 'none';
      document.querySelector('.tabs button.active').classList.remove('active');
      document.getElementById(`${tabName}-tab`).style.display = 'block';
      document.getElementById(`${tabName}-tab-btn`).classList.add('active');
      messageEl.textContent = '';
    }

    // --- LOGIN FUNCTIONS (No changes) ---
    async function generateLoginOtp() {
      const phoneNumber = document.getElementById('loginPhone').value;
      if (!phoneNumber) { messageEl.textContent = 'Please enter a phone number.'; return; }
      messageEl.textContent = 'Generating OTP...';
      const response = await fetch('/api/server/donor/generate-otp', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ phoneNumber })
      });
      const result = await response.json();
      messageEl.textContent = result.message;
      if (result.success) {
          messageEl.className = 'message-area message-success';
          alert(`Your Login OTP is: ${result.otp}`);
          document.getElementById('loginOtpGroup').style.display = 'block';
      } else {
          messageEl.className = 'message-area message-error';
      }
    }

    async function handleLogin(event) {
        event.preventDefault();
        const payload = {
            phoneNumber: document.getElementById('loginPhone').value,
            otp: document.getElementById('loginOtp').value
        };
        const response = await fetch('/api/server/donor/login', {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
        });
        const result = await response.json();
        if (result.success) {
            alert('Login Successful!');
            sessionStorage.setItem('donorInfo', JSON.stringify(result.user));
            window.location.href = './donor-dashboard.html';
        } else {
            messageEl.textContent = result.message;
            messageEl.className = 'message-area message-error';
        }
    }
    
    // --- REGISTRATION FUNCTIONS (UPDATED) ---
    async function generateRegisterOtp() {
        const form = document.getElementById('donorRegisterForm');
        if (!form.checkValidity()) {
            messageEl.textContent = 'Please fill out all required fields.';
            return;
        }

        // --- NEW: CUSTOM BLOOD TYPE VALIDATION LOGIC ---
        const bloodTypeInput = document.getElementById('regBloodType');
        const bloodTypeValue = bloodTypeInput.value.trim().toUpperCase();
        
        // Regex to check for A, B, AB, O followed by + or -
        const validBloodTypeRegex = /^(A|B|AB|O)[+-]$/;

        if (!validBloodTypeRegex.test(bloodTypeValue)) {
            messageEl.textContent = 'Invalid Blood Type. Please use format like A+, O-, or AB+.';
            messageEl.className = 'message-area message-error';
            return;
        }
        // --- END OF VALIDATION LOGIC ---

        // If validation passes, proceed with OTP generation
        const phoneNumber = document.getElementById('regPhone').value;
        messageEl.textContent = 'Requesting OTP...';
        const response = await fetch('/api/server/donor/register-request', {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ phoneNumber })
        });
        const result = await response.json();
        messageEl.textContent = result.message;
        if (result.success) {
            messageEl.className = 'message-area message-success';
            alert(`Your Registration OTP is: ${result.otp}`);
            document.getElementById('registerOtpGroup').style.display = 'block';
        } else {
            messageEl.className = 'message-area message-error';
        }
    }

    async function handleRegistration(event) {
        event.preventDefault();
        const bloodTypeInput = document.getElementById('regBloodType');
        
        // Final format check before sending to server
        const bloodTypeValue = bloodTypeInput.value.trim().toUpperCase();
        const validBloodTypeRegex = /^(A|B|AB|O)[+-]$/;
        if (!validBloodTypeRegex.test(bloodTypeValue)) {
             messageEl.textContent = 'Invalid Blood Type. Please use format like A+, O-, or AB+.';
             messageEl.className = 'message-area message-error';
             return;
        }

        const payload = {
            fullName: document.getElementById('regName').value,
            phoneNumber: document.getElementById('regPhone').value,
            pincode: document.getElementById('regPincode').value,
            bloodType: bloodTypeValue, // Send the cleaned, uppercase value
            otp: document.getElementById('registerOtp').value
        };

        const response = await fetch('/api/server/donor/register-confirm', {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
        });
        const result = await response.json();
        messageEl.textContent = result.message;
        if (result.success) {
            messageEl.className = 'message-area message-success';
            alert('Registered successfully! Please switch to the Login tab.');
            setTimeout(() => showTab('login'), 2000);
        } else {
            messageEl.className = 'message-area message-error';
        }
    }
  </script>
</body>
</html>
