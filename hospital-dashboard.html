<!DOCTYPE html>

<html lang="en">

  <title>Hospital Dashboard - LifeLink</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
  <style>
    body {
      background-color: #f9fafc;
      font-family: "Poppins", sans-serif;
    }
    .dashboard-container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 20px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
    }
    .sos-alert {
      border-left: 6px solid #dc3545;
      padding: 12px 16px;
      background-color: #fff4f4;
      margin-bottom: 10px;
      border-radius: 8px;
    }
    .btn-response {
      margin-right: 8px;
    }
    #alertsList {
      max-height: 400px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <div class="dashboard-container">
    <h2 class="text-center mb-4">🏥 Hospital Dashboard</h2>

<div class="mb-4">
  <label for="hospitalId" class="form-label">Hospital ID</label>
  <input type="text" id="hospitalId" class="form-control" placeholder="Enter your Hospital ID" />
  <button id="loadAlertsBtn" class="btn btn-primary mt-3">Load SOS Alerts</button>
</div>

<h4 class="mb-3">🔴 Live SOS Alerts</h4>
<div id="alertsList"></div>

  <button id="verifyTokenBtn" class="btn btn-success">Verify Token</button>
</div>
