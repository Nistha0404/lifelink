<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hospital Dashboard - LifeLink</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .verify-grid { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
    .verify-input { width:120px; font-size:18px; text-align:center; letter-spacing:3px; }
    .verify-results { margin-top:12px; }
    .kv { display:grid; grid-template-columns: 180px 1fr; gap:6px 12px; }
    .pill { display:inline-block; padding:4px 8px; border-radius:6px; background:#eef2ff; font-weight:700; letter-spacing:2px; }
    .muted { color:#666; font-size:12px; }
    .divider { height:1px; background:#eee; margin:10px 0; }
    .qr-preview { width:120px; height:120px; object-fit:contain; }
    .hint { font-size:12px; color:#555; margin-top:4px; }
    .ok { color:green; } .err { color:#c00; }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <img src="lifeLinklogoD.png" alt="LifeLink Logo" height="40" />
      <span>LifeLink</span>
    </div>
    <nav><a href="#" id="logoutBtn">Logout</a></nav>
  </header>

  <main>
    <section class="dashboard-container">
      <div class="dashboard-header">
        <h2 id="welcome-message">Hospital Console</h2>
      </div>

      <div class="dashboard-grid">

        <!-- SOS Broadcast -->
        <div class="dashboard-card sos-creator-card">
          <h3>SOS Broadcast</h3>
          <form id="hospital-sos-form">
            <div class="form-group">
              <label for="sos-component">Component</label>
              <select id="sos-component" required>
                <option value="Whole Blood">Whole Blood</option>
                <option value="RBC">RBC</option>
                <option value="Plasma">Plasma</option>
                <option value="Platelets">Platelets</option>
              </select>
            </div>
            <div class="form-group">
              <label for="sos-blood-type">Blood Type</label>
              <select id="sos-blood-type" required>
                <option value="A+">A+</option><option value="A-">A-</option>
                <option value="B+">B+</option><option value="B-">B-</option>
                <option value="O+">O+</option><option value="O-">O-</option>
                <option value="AB+">AB+</option><option value="AB-">AB-</option>
              </select>
            </div>
            <div class="form-group">
              <label for="sos-units">Units Needed</label>
              <input type="number" id="sos-units" value="1" min="1" required />
            </div>
            <div class="form-group">
              <label for="sos-urgency">Urgency</label>
              <select id="sos-urgency" required>
                <option value="Critical">Critical (Immediate Need)</option>
                <option value="Urgent">Urgent (Within Hours)</option>
                <option value="Routine">Routine (Within 24 Hours)</option>
              </select>
            </div>
            <button type="submit" class="btn-danger">Broadcast SOS</button>
          </form>
          <p id="hospital-sos-message" class="message-area"></p>
        </div>

        <!-- Stock Lite -->
        <div class="dashboard-card inventory-card">
          <h3>Blood Stock Management</h3>
          <div id="inventory-container" class="inventory-grid-management"></div>
          <button id="save-inventory-btn" class="btn-primary">Save Stock Levels</button>
          <p id="inventory-message" class="message-area"></p>
        </div>

        <!-- Unified Token Verification -->
        <div class="dashboard-card verify-card">
          <h3>Verify Patient/Donor Token</h3>
          <div class="verify-grid">
            <input id="verify-token-input" class="verify-input" maxlength="4"
                   inputmode="numeric" pattern="[0-9]{4}" placeholder="1234" />
            <button id="verify-btn" class="btn-primary">Verify</button>
            <span id="verify-hint" class="hint">Enter a 4-digit token from the patient or donor.</span>
          </div>
          <p id="verify-message" class="message-area"></p>
          <div id="verify-results" class="verify-results"></div>
        </div>

        <!-- Live SOS -->
        <div class="dashboard-card sos-card">
          <h3>SOS Monitor </h3>
          <ul id="live-sos-list" class="live-sos-list">
            <li class="no-requests">No active SOS requests.</li>
          </ul>
        </div>

        <!-- Playbooks -->
        <div class="dashboard-card playbooks-card">
          <h3>Playbooks</h3>
          <div id="playbooks-list"></div>
          <textarea id="playbook-editor" placeholder="Write a new policy..."></textarea>
          <input type="text" id="playbook-title" placeholder="Policy Title" />
          <button id="save-playbook-btn" class="btn-secondary">Save Playbook</button>
        </div>

        <div class="dashboard-card donor-log-card">
    <h3>Donor Appointment Log</h3>
    <button id="refresh-donor-log-btn" class="btn-secondary">Refresh Log</button>
    
    <ul id="donor-log-list" class="appointment-list">
        <li id="donor-log-placeholder">No appointments found.</li>
        
        </ul>
</div>

      </div>
    </section>
  </main>

  <script src="hospital-dashboard.js"></script>

  <footer>
        <p>© 2025 LifeLink</p>
    </footer> 
</body>
</html>
