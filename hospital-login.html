  </main>

  <script>
    const messageEl = document.getElementById("message");

    function showTab(tabName) {
      document.getElementById('login-tab').style.display = tabName === 'login' ? 'block' : 'none';
      document.getElementById('register-tab').style.display = tabName === 'register' ? 'block' : 'none';
      document.getElementById('login-tab-btn').classList.toggle('active', tabName === 'login');
      document.getElementById('register-tab-btn').classList.toggle('active', tabName === 'register');
      messageEl.textContent = '';
    }

    // --- OTP Sending ---
    document.getElementById('sendOtpBtn').addEventListener('click', async () => {
      const phone = document.getElementById('loginPhone').value.trim();
      if (!phone) {
        messageEl.textContent = 'Enter your phone number.';
        messageEl.style.color = 'red';
        return;
      }
      messageEl.textContent = 'Sending OTP...';
      try {
        const res = await fetch('/api/server/send-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone_number: phone, role: 'hospital' })
        });
        const data = await res.json();
        if (data.success) {
          messageEl.textContent = 'OTP sent successfully!';
          messageEl.style.color = 'green';
          document.getElementById('otpSection').classList.remove('hidden');
        } else {
          messageEl.textContent = data.message || 'Failed to send OTP.';
          messageEl.style.color = 'red';
        }
      } catch (err) {
        messageEl.textContent = 'Server error. Try again.';
        messageEl.style.color = 'red';
      }
    });

    // --- OTP Verification & Login ---
    document.getElementById('verifyBtn').addEventListener('click', async () => {
      const phone = document.getElementById('loginPhone').value.trim();
      const otp = document.getElementById('otp').value.trim();
      if (!phone || !otp) {
        messageEl.textContent = 'Enter both phone and OTP.';
        messageEl.style.color = 'red';
        return;
      }
      messageEl.textContent = 'Verifying OTP...';
      try {
        const res = await fetch('/api/server/hospital-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone_number: phone, otp })
        });
        const data = await res.json();
        if (data.success) {
          messageEl.textContent = 'Login successful! Redirecting...';
          messageEl.style.color = 'green';
          sessionStorage.setItem('currentHospital', JSON.stringify(data.hospital));
          setTimeout(() => window.location.href = 'hospital-dashboard.html', 1200);
        } else {
          messageEl.textContent = data.message || 'Invalid OTP.';
          messageEl.style.color = 'red';
        }
      } catch (err) {
        messageEl.textContent = 'Error verifying OTP.';
        messageEl.style.color = 'red';
      }
    });

    // --- Registration Logic ---
    document.getElementById('hospitalRegisterForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const hospitalData = {
        name: document.getElementById("hospitalName").value.trim(),
        address: document.getElementById("address").value.trim(),
        pincode: document.getElementById("pincode").value.trim(),
        phone_number: document.getElementById("registerPhone").value.trim()
      };
      messageEl.textContent = 'Registering hospital...';
      try {
        const res = await fetch('/api/server/hospital-register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(hospitalData)
        });
        const data = await res.json();
        if (data.success) {
          messageEl.textContent = `Registered successfully! Hospital ID: ${data.hospital_id}`;
          messageEl.style.color = 'green';
          showTab('login');
        } else {
          messageEl.textContent = data.message || 'Registration failed.';
          messageEl.style.color = 'red';
        }
      } catch (err) {
        messageEl.textContent = 'Server error during registration.';
        messageEl.style.color = 'red';
      }
    });
  </script>
