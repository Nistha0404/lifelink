<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Portal - LifeLink</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-page" style="min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr; background: var(--neutral-50);">
        
        <!-- Sidebar -->
        <div class="auth-sidebar" style="background: var(--gradient-primary); padding: var(--space-12); color: white;">
            <div class="auth-sidebar-content">
                <h2 style="font-size: var(--text-4xl); margin-bottom: var(--space-4);">Hospital Management Portal</h2>
                <p style="font-size: var(--text-lg); line-height: var(--leading-relaxed);">
                    Manage blood requests, inventory, and coordinate with donors efficiently.
                </p>
            </div>
        </div>
        
        <!-- Main Content -->
        <div class="auth-content" style="padding: var(--space-12); display: flex; flex-direction: column; justify-content: center;">
            
            <a href="index.html" class="auth-logo" style="display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-8); text-decoration: none; color: var(--primary-600);">
                <span style="font-size: var(--text-2xl); font-weight: var(--font-bold);">LifeLink</span>
            </a>
            
            <div class="auth-header" style="margin-bottom: var(--space-8);">
                <h1 class="auth-title" style="font-size: var(--text-3xl); margin-bottom: var(--space-3);">Hospital Portal</h1>
                <p class="auth-subtitle" style="color: var(--neutral-600);">Sign in to access your hospital dashboard</p>
            </div>
            
            <!-- Tabs -->
            <div class="auth-tabs" style="display: flex; gap: var(--space-2); background: var(--neutral-100); padding: var(--space-1); border-radius: var(--radius-lg); margin-bottom: var(--space-8);">
                <button class="auth-tab active" data-tab="login" style="flex: 1; padding: var(--space-3); background: white; border: none; border-radius: var(--radius-md); cursor: pointer;">
                    Login
                </button>
                <button class="auth-tab" data-tab="register" style="flex: 1; padding: var(--space-3); background: transparent; border: none; border-radius: var(--radius-md); cursor: pointer; color: var(--neutral-600);">
                    Register
                </button>
            </div>
            
            <!-- Login Form -->
            <div id="login-form" class="auth-form">
                <form id="hospitalLoginForm" style="max-width: 400px;">
                    <div class="form-group">
                        <label for="hospitalId" class="form-label">Hospital ID</label>
                        <input type="text" id="hospitalId" class="form-input" placeholder="e.g., HOS101" required>
                        <p class="form-hint">Use your assigned hospital ID</p>
                    </div>
                    
                    <div class="form-group">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" id="password" class="form-input" placeholder="Enter your password" required>
                    </div>
                    
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Sign In</button>
                </form>
                
                <div id="login-message" class="message-area" style="margin-top: var(--space-4);"></div>
            </div>
            
            <!-- Register Form -->
            <div id="register-form" class="auth-form" style="display: none;">
                <form id="hospitalRegisterForm" style="max-width: 400px;">
                    <div class="form-group">
                        <label for="regHospitalName" class="form-label">Hospital Name <span class="required">*</span></label>
                        <input type="text" id="regHospitalName" class="form-input" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="regAddress" class="form-label">Address <span class="required">*</span></label>
                        <textarea id="regAddress" class="form-input" rows="2" required></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label for="regPincode" class="form-label">Pincode <span class="required">*</span></label>
                        <input type="text" id="regPincode" class="form-input" maxlength="6" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="regPhone" class="form-label">Phone Number <span class="required">*</span></label>
                        <input type="tel" id="regPhone" class="form-input" maxlength="10" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="regPassword" class="form-label">Password <span class="required">*</span></label>
                        <input type="password" id="regPassword" class="form-input" required>
                    </div>
                    
                    <button type="button" id="fetchLocationBtn" class="btn btn-outline" style="width: 100%; margin-bottom: var(--space-4);">
                        📍 Get Current Location
                    </button>
                    
                    <input type="hidden" id="regLatitude">
                    <input type="hidden" id="regLongitude">
                    <p id="locationStatus" class="form-hint"></p>
                    
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Register Hospital</button>
                </form>
                
                <div id="register-message" class="message-area" style="margin-top: var(--space-4);"></div>
            </div>
            
        </div>
    </div>
    
    <script>
    // Tab switching
    document.querySelectorAll('.auth-tab').forEach(tab => {
        tab.addEventListener('click', () => {
            const targetTab = tab.dataset.tab;
            
            // Update active tab
            document.querySelectorAll('.auth-tab').forEach(t => {
                t.classList.remove('active');
                t.style.background = 'transparent';
                t.style.color = 'var(--neutral-600)';
            });
            tab.classList.add('active');
            tab.style.background = 'white';
            tab.style.color = 'var(--primary-600)';
            
            // Show/hide forms
            document.getElementById('login-form').style.display = targetTab === 'login' ? 'block' : 'none';
            document.getElementById('register-form').style.display = targetTab === 'register' ? 'block' : 'none';
        });
    });
    
    // ========== LOGIN FORM ==========
    document.getElementById('hospitalLoginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const hospitalId = document.getElementById('hospitalId').value.trim();
        const password = document.getElementById('password').value;
        const messageEl = document.getElementById('login-message');
        
        messageEl.textContent = 'Logging in...';
        messageEl.className = 'message-area message-info';
        messageEl.style.display = 'block';
        
        try {
            const response = await fetch('/api/server/hospital-login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ hospitalId, password })
            });
            
            const result = await response.json();
            
            if (result.success) {
                messageEl.textContent = result.message;
                messageEl.className = 'message-area message-success';
                
                // Store hospital info
                sessionStorage.setItem('currentHospital', JSON.stringify(result.hospital));
                
                // Redirect to dashboard
                setTimeout(() => {
                    window.location.href = 'hospital-dashboard.html';
                }, 1000);
            } else {
                messageEl.textContent = result.message;
                messageEl.className = 'message-area message-error';
            }
        } catch (error) {
            console.error('Login error:', error);
            messageEl.textContent = 'Could not connect to server. Please try again.';
            messageEl.className = 'message-area message-error';
        }
    });
    
    // ========== REGISTER FORM ==========
    document.getElementById('fetchLocationBtn').addEventListener('click', () => {
        const statusEl = document.getElementById('locationStatus');
        statusEl.textContent = 'Getting location...';
        statusEl.style.color = 'var(--info)';
        
        if (!navigator.geolocation) {
            statusEl.textContent = 'Geolocation not supported';
            statusEl.style.color = 'var(--error)';
            return;
        }
        
        navigator.geolocation.getCurrentPosition(
            (position) => {
                document.getElementById('regLatitude').value = position.coords.latitude;
                document.getElementById('regLongitude').value = position.coords.longitude;
                statusEl.textContent = `✓ Location captured (${position.coords.latitude.toFixed(4)}, ${position.coords.longitude.toFixed(4)})`;
                statusEl.style.color = 'var(--success)';
            },
            (error) => {
                statusEl.textContent = 'Location access denied. We\'ll use pincode.';
                statusEl.style.color = 'var(--warning)';
            }
        );
    });
    
    document.getElementById('hospitalRegisterForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const hospitalName = document.getElementById('regHospitalName').value.trim();
        const address = document.getElementById('regAddress').value.trim();
        const pincode = document.getElementById('regPincode').value.trim();
        const phoneNumber = document.getElementById('regPhone').value.trim();
        const password = document.getElementById('regPassword').value;
        const latitude = document.getElementById('regLatitude').value;
        const longitude = document.getElementById('regLongitude').value;
        
        const messageEl = document.getElementById('register-message');
        
        messageEl.textContent = 'Registering hospital...';
        messageEl.className = 'message-area message-info';
        messageEl.style.display = 'block';
        
        try {
            const response = await fetch('/api/server/hospital-register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    hospitalName,
                    address,
                    pincode,
                    phoneNumber,
                    password,
                    latitude: latitude || null,
                    longitude: longitude || null
                })
            });
            
            const result = await response.json();
            
            if (result.success) {
                messageEl.textContent = `${result.message} Your Hospital ID: ${result.hospital.hospital_id}`;
                messageEl.className = 'message-area message-success';
                
                alert(`Registration Successful!\n\nYour Hospital ID: ${result.hospital.hospital_id}\nPlease save this ID for login.`);
                
                // Switch to login tab
                setTimeout(() => {
                    document.querySelector('[data-tab="login"]').click();
                    document.getElementById('hospitalId').value = result.hospital.hospital_id;
                }, 2000);
            } else {
                messageEl.textContent = result.message;
                messageEl.className = 'message-area message-error';
            }
        } catch (error) {
            console.error('Register error:', error);
            messageEl.textContent = 'Could not connect to server. Please try again.';
            messageEl.className = 'message-area message-error';
        }
    });
    </script>
    
    <style>
        .message-area {
            display: none;
            padding: var(--space-4);
            border-radius: var(--radius-lg);
            border: 1px solid;
        }
        .message-area.message-success {
            display: block;
            background: var(--success-light);
            color: var(--success);
            border-color: var(--success);
        }
        .message-area.message-error {
            display: block;
            background: var(--error-light);
            color: var(--error);
            border-color: var(--error);
        }
        .message-area.message-info {
            display: block;
            background: var(--info-light);
            color: var(--info);
            border-color: var(--info);
        }
    </style>
</body>
</html>
