<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Portal - LifeLink</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    
    <style>
        .auth-page {
            min-height: 100vh;
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: var(--neutral-50);
        }
        
        .auth-sidebar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: var(--space-12);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            color: white;
            position: relative;
            overflow: hidden;
        }
        
        .auth-sidebar::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
            pointer-events: none;
        }
        
        .auth-sidebar-content {
            position: relative;
            z-index: 1;
        }
        
        .auth-sidebar h2 {
            font-size: var(--text-4xl);
            color: white;
            margin-bottom: var(--space-4);
        }
        
        .auth-sidebar p {
            font-size: var(--text-lg);
            color: rgba(255, 255, 255, 0.9);
            line-height: var(--leading-relaxed);
        }
        
        .auth-content {
            padding: var(--space-12);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .auth-header {
            margin-bottom: var(--space-8);
        }
        
        .auth-logo {
            display: flex;
            align-items: center;
            gap: var(--space-3);
            font-size: var(--text-2xl);
            font-weight: var(--font-bold);
            color: var(--primary-600);
            margin-bottom: var(--space-8);
        }
        
        .auth-logo img {
            height: 40px;
            width: auto;
        }
        
        .auth-title {
            font-size: var(--text-3xl);
            margin-bottom: var(--space-3);
        }
        
        .auth-subtitle {
            color: var(--neutral-600);
            font-size: var(--text-base);
        }
        
        .auth-tabs {
            display: flex;
            gap: var(--space-2);
            background: var(--neutral-100);
            padding: var(--space-1);
            border-radius: var(--radius-lg);
            margin-bottom: var(--space-8);
        }
        
        .auth-tab {
            flex: 1;
            padding: var(--space-3) var(--space-4);
            background: transparent;
            border: none;
            border-radius: var(--radius-md);
            font-size: var(--text-sm);
            font-weight: var(--font-medium);
            color: var(--neutral-600);
            cursor: pointer;
            transition: all var(--transition-fast);
        }
        
        .auth-tab.active {
            background: white;
            color: var(--primary-600);
            box-shadow: var(--shadow-sm);
        }
        
        .auth-form {
            max-width: 400px;
        }
        
        .message-success {
            padding: var(--space-4);
            background: var(--success-light);
            color: var(--success);
            border-radius: var(--radius-lg);
            margin-bottom: var(--space-4);
            border: 1px solid var(--success);
            font-weight: 500;
        }
        
        .message-error {
            padding: var(--space-4);
            background: var(--error-light);
            color: var(--error);
            border-radius: var(--radius-lg);
            margin-bottom: var(--space-4);
            border: 1px solid var(--error);
            font-weight: 500;
        }
        
        .auth-footer {
            margin-top: var(--space-6);
            text-align: center;
            font-size: var(--text-sm);
            color: var(--neutral-600);
        }
        
        .auth-footer a {
            color: var(--primary-600);
            font-weight: var(--font-medium);
        }
        
        @media (max-width: 1024px) {
            .auth-page {
                grid-template-columns: 1fr;
            }
            
            .auth-sidebar {
                display: none;
            }
            
            .auth-content {
                padding: var(--space-8) var(--space-6);
            }
        }
    </style>
</head>
<body>
    <div class="auth-page">
        <!-- Sidebar -->
        <div class="auth-sidebar">
            <div class="auth-sidebar-content">
                <div class="auth-logo" style="color: white;">
                    <img src="lifeLinklogoD.png" alt="LifeLink Logo" onerror="this.style.display='none'">
                    <span>LifeLink</span>
                </div>
                
                <h2>🏥 Hospital Portal</h2>
                <p>
                    Manage blood inventory, coordinate donations, and respond to emergency requests. 
                    Your commitment saves lives.
                </p>
            </div>
            
            <p style="font-size: var(--text-sm); opacity: 0.8;">
                © 2025 LifeLink. All rights reserved.
            </p>
        </div>
        
        <!-- Content -->
        <div class="auth-content">
            <div class="auth-header">
                <a href="index.html" class="auth-logo">
                    <img src="lifeLinklogoD.png" alt="LifeLink Logo" onerror="this.style.display='none'">
                    <span>LifeLink</span>
                </a>
                
                <h1 class="auth-title">Hospital Portal</h1>
                <p class="auth-subtitle">Secure access to hospital dashboard</p>
            </div>
            
            <!-- Tabs -->
            <div class="auth-tabs">
                <button class="auth-tab active" id="login-tab-btn" onclick="showTab('login')">Login</button>
                <button class="auth-tab" id="register-tab-btn" onclick="showTab('register')">Register</button>
            </div>
            
            <!-- Login Form -->
            <div id="login-tab" class="auth-form">
                <form id="hospitalLoginForm">
                    <div class="form-group">
                        <label class="form-label" for="loginPhone">
                            Phone Number <span class="required">*</span>
                        </label>
                        <input 
                            type="tel" 
                            id="loginPhone" 
                            class="form-input" 
                            placeholder="10-digit mobile number"
                            maxlength="10"
                            pattern="[0-9]{10}"
                            required
                        >
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="loginPassword">
                            Password <span class="required">*</span>
                        </label>
                        <input 
                            type="password" 
                            id="loginPassword" 
                            class="form-input" 
                            placeholder="Enter your password"
                            required
                        >
                    </div>
                    
                    <button type="submit" class="btn btn-primary" style="width: 100%;">
                        Login to Hospital Portal
                    </button>
                </form>
            </div>
            
            <!-- Register Form -->
            <div id="register-tab" class="auth-form" style="display: none;">
                <form id="hospitalRegisterForm">
                    <div class="form-group">
                        <label class="form-label" for="registerHospitalName">
                            Hospital Name <span class="required">*</span>
                        </label>
                        <input 
                            type="text" 
                            id="registerHospitalName" 
                            class="form-input" 
                            placeholder="Enter hospital name"
                            required
                        >
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="registerPhone">
                            Phone Number <span class="required">*</span>
                        </label>
                        <input 
                            type="tel" 
                            id="registerPhone" 
                            class="form-input" 
                            placeholder="10-digit mobile number"
                            maxlength="10"
                            pattern="[0-9]{10}"
                            required
                        >
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="registerEmail">
                            Email Address
                        </label>
                        <input 
                            type="email" 
                            id="registerEmail" 
                            class="form-input" 
                            placeholder="hospital@example.com"
                        >
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="registerAddress">
                            Address <span class="required">*</span>
                        </label>
                        <textarea 
                            id="registerAddress" 
                            class="form-input" 
                            placeholder="Hospital address"
                            rows="2"
                            required
                        ></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="registerPincode">
                            Pincode <span class="required">*</span>
                        </label>
                        <input 
                            type="text" 
                            id="registerPincode" 
                            class="form-input" 
                            placeholder="6-digit pincode"
                            maxlength="6"
                            pattern="[0-9]{6}"
                            required
                        >
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="registerPassword">
                            Create Password <span class="required">*</span>
                        </label>
                        <input 
                            type="password" 
                            id="registerPassword" 
                            class="form-input" 
                            placeholder="Minimum 6 characters"
                            minlength="6"
                            required
                        >
                    </div>
                    
                    <button type="submit" class="btn btn-primary" style="width: 100%;">
                        Register Hospital
                    </button>
                </form>
            </div>
            
            <div id="message"></div>
            
            <div class="auth-footer">
                <p>
                    <a href="index.html">← Back to Home</a>
                </p>
            </div>
        </div>
    </div>
    
    <script>
        const loginForm = document.getElementById("hospitalLoginForm");
        const registerForm = document.getElementById("hospitalRegisterForm");
        const messageEl = document.getElementById("message");

        // CRITICAL FIX: Check if already logged in BEFORE rendering page
        const existingToken = sessionStorage.getItem('hospitalToken');
        if (existingToken) {
            // Already logged in, redirect immediately
            console.log('Already logged in, redirecting to dashboard...');
            window.location.replace('hospital-dashboard.html');
            // Prevent further script execution
            throw new Error('Redirecting to dashboard');
        }

        function showTab(tabName) {
            document.getElementById('login-tab').style.display = tabName === 'login' ? 'block' : 'none';
            document.getElementById('register-tab').style.display = tabName === 'register' ? 'block' : 'none';
            document.getElementById('login-tab-btn').classList.toggle('active', tabName === 'login');
            document.getElementById('register-tab-btn').classList.toggle('active', tabName === 'register');
            messageEl.style.display = 'none';
            messageEl.className = '';
        }

        function showMessage(text, type) {
            messageEl.textContent = text;
            messageEl.className = type === 'success' ? 'message-success' : 'message-error';
            messageEl.style.display = 'block';
            
            if (type === 'success') {
                setTimeout(() => {
                    messageEl.style.display = 'none';
                }, 5000);
            }
        }

        // Registration Handler
        registerForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            
            const hospitalName = document.getElementById("registerHospitalName").value.trim();
            const phoneNumber = document.getElementById("registerPhone").value.trim();
            const email = document.getElementById("registerEmail").value.trim();
            const address = document.getElementById("registerAddress").value.trim();
            const pincode = document.getElementById("registerPincode").value.trim();
            const password = document.getElementById("registerPassword").value;

            if (!/^\d{10}$/.test(phoneNumber)) {
                showMessage('Please enter a valid 10-digit phone number', 'error');
                return;
            }

            if (!/^\d{6}$/.test(pincode)) {
                showMessage('Please enter a valid 6-digit pincode', 'error');
                return;
            }

            if (password.length < 6) {
                showMessage('Password must be at least 6 characters', 'error');
                return;
            }

            const submitBtn = registerForm.querySelector('button[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Registering...';

            try {
                const response = await fetch('/api/server/register/hospital', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ hospitalName, phoneNumber, password, address, pincode, email })
                });
                
                const result = await response.json();

                if (result.success) {
                    showMessage(`✅ ${result.message} You can now log in.`, 'success');
                    setTimeout(() => {
                        registerForm.reset();
                        showTab('login');
                    }, 2000);
                } else {
                    showMessage(`❌ ${result.message}`, 'error');
                }
            } catch (error) {
                console.error('Registration error:', error);
                showMessage('❌ Could not connect to the server. Please try again.', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Register Hospital';
            }
        });

        // Login Handler - CRITICAL FIX: Proper redirect
        loginForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            
            const phoneNumber = document.getElementById("loginPhone").value.trim();
            const password = document.getElementById("loginPassword").value;

            if (!/^\d{10}$/.test(phoneNumber)) {
                showMessage('Please enter a valid 10-digit phone number', 'error');
                return;
            }

            if (!password) {
                showMessage('Password is required', 'error');
                return;
            }

            const submitBtn = loginForm.querySelector('button[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Logging in...';

            try {
                const response = await fetch('/api/server/login/hospital', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phoneNumber, password })
                });
                
                const result = await response.json();

                if (result.success) {
                    // Store authentication data
                    sessionStorage.setItem('hospitalToken', result.token);
                    sessionStorage.setItem('hospitalId', result.hospital.hospital_id);
                    sessionStorage.setItem('hospitalName', result.hospital.hospitalName);
                    sessionStorage.setItem('hospitalPhone', result.hospital.phoneNumber);
                    sessionStorage.setItem('hospitalAddress', result.hospital.address);
                    sessionStorage.setItem('hospitalPincode', result.hospital.pincode);
                    
                    showMessage('✅ Login successful! Redirecting...', 'success');
                    
                    // CRITICAL: Use replace() instead of href to prevent back button issues
                    setTimeout(() => {
                        window.location.replace('hospital-dashboard.html');
                    }, 1000);
                } else {
                    showMessage(`❌ ${result.message}`, 'error');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Login to Hospital Portal';
                }
            } catch (error) {
                console.error('Login error:', error);
                showMessage('❌ Could not connect to the server. Please try again.', 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Login to Hospital Portal';
            }
        });
    </script>
</body>
</html>
