<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to LifeLink - A Lifesaving Connection</title>
    
    <!-- Using the 'Inter' font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body class="landing-page">
    <!-- Consistent Header -->
    <header>
        <div class="logo">
            <img src="lifeLinklogoD.png" alt="LifeLink Logo" onerror="this.src='https://placehold.co/40x40/2a5c60/FFFFFF?text=LL'; this.onerror=null;">
            <span>LifeLink</span>
        </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="volunteer-login.html">Be a Volunteer</a>
            <a href="facts.html">Facts</a>
        </nav>
    </header>

    <!-- 
      MODIFICATION: The <main> tag now holds the new two-column hero-container.
      This matches the layout of your inspiration image.
    -->
    <main>
        <div class="hero-container">
            <!-- Column 1: Content (Text + Buttons) -->
            <div class="hero-content">
                <!-- Hero Section -->
                <section class="hero">
                    <h1>Welcome to LifeLink</h1>
                    <p>Please choose your login type to get started.</p>
                </section>

                <!-- Role Selection Section -->
                <div class="login-button-stack">
                    <a href="patient-login.html" class="btn-gradient">Patient Login</a>
                    <a href="donor-questionnaire.html" class="btn-gradient">Donor Login</a>
                    <a href="hospital-login.html" class="btn-gradient">Hospital Login</a>
                    <a href="admin-login.html" class="btn-gradient">Admin Login</a>
                </div>
            </div>
            
            <!-- Column 2: Image -->
            <!-- 
              IMAGE SPACE: Replace the 'background-image' URL in style.css
              in the '.hero-image' rule.
            -->
            <div class="hero-image">
                <!-- This div is intentionally empty. The image is added via CSS. -->
            </div>
        </div>
    </main>

    <!-- Consistent Footer -->
    <footer>
        <p>© 2025 LifeLink</p>
    </footer>

</body>
</html>
