<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Patient Dashboard - LifeLink</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">
            <span>LifeLink</span>
        </div>
        <nav>
            <a href="#" id="logoutBtn">Logout</a>
        </nav>
    </header>
    <main>
        <section class="main-card">
            <h2 id="welcome-message">Welcome!</h2>
            
            <div id="sos-section">
                <h3>Request Emergency Blood</h3>
                <p>Your precise location is primary. The pincode will be used as a backup.</p>
                <form id="sosForm">
                    <div class="form-group">
                        <label for="bloodType">Blood Type Needed:</label>
                        <select id="bloodType" required>
                            <option value="" disabled selected>-- Select --</option>
                            <option value="A+">A+</option>
                            <option value="A-">A-</option>
                            <option value="B+">B+</option>
                            <option value="B-">B-</option>
                            <option value="O+">O+</option>
                            <option value="O-">O-</option>
                            <option value="AB+">AB+</option>
                            <option value="AB-">AB-</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="pincode">Pincode (Required Backup):</label>
                        <input type="text" id="pincode" placeholder="Enter 6-digit pincode" maxlength="6" required>
                    </div>
                    <button type="submit" id="sosBtn">Send SOS Alert</button>
                </form>
                <p id="sosMessage" class="message-area"></p>
            </div>

            <div class="action-buttons">
                <button id="historyBtn">View Request History</button>
                <button id="statusBtn">Refresh Status</button>
            </div>

            <div id="history-section" class="hidden">
                <h3>Your Request History</h3>
                <table id="history-table">
                    <thead>
                        <tr>
                            <th>Date & Time</th>
                            <th>Blood Type</th>
                            <th>Pincode</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="history-body">
                        </tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        const welcomeMessage = document.getElementById('welcome-message');
        const sosForm = document.getElementById('sosForm');
        const sosMessage = document.getElementById('sosMessage');
        const historySection = document.getElementById('history-section');
        const historyBody = document.getElementById('history-body');
        const historyBtn = document.getElementById('historyBtn');
        const statusBtn = document.getElementById('statusBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const pincodeInput = document.getElementById('pincode');

        let currentUser = null;

        // --- Page Initialization ---
        document.addEventListener('DOMContentLoaded', () => {
            const userData = sessionStorage.getItem('currentUser');
            if (!userData) {
                alert('You are not logged in. Redirecting...');
                window.location.href = '/patient-login.html';
                return;
            }
            currentUser = JSON.parse(userData);
            welcomeMessage.textContent = `Welcome, ${currentUser.full_name}!`;
            if (currentUser.pincode) {
                pincodeInput.value = currentUser.pincode;
            }
        });

        // --- Event Listeners ---
        logoutBtn.addEventListener('click', () => {
            sessionStorage.removeItem('currentUser');
            window.location.href = '/patient-login.html';
        });

        sosForm.addEventListener('submit', handleSosRequest);
        historyBtn.addEventListener('click', () => {
            historySection.classList.toggle('hidden');
            if (!historySection.classList.contains('hidden')) fetchRequestHistory();
        });
        statusBtn.addEventListener('click', () => {
            historySection.classList.remove('hidden');
            fetchRequestHistory();
        });

        // --- Functions ---
        function getGeolocation() {
            return new Promise((resolve, reject) => {
                if (!navigator.geolocation) {
                    return reject({ code: -1, message: "Geolocation not supported by this browser." });
                }
                navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: 15000 });
            });
        }

        async function handleSosRequest(event) {
            event.preventDefault();
            const bloodType = document.getElementById('bloodType').value;
            const pincode = pincodeInput.value;

            if (!bloodType || !pincode || pincode.length !== 6) {
                sosMessage.textContent = 'Please select a blood type and enter a valid 6-digit pincode.';
                return;
            }

            sosMessage.textContent = 'Attempting to get your precise location...';
            let location = { latitude: null, longitude: null };

            try {
                const position = await getGeolocation();
                location.latitude = position.coords.latitude;
                location.longitude = position.coords.longitude;
                sosMessage.textContent = 'Precise location found! Sending SOS...';
            } catch (error) {
                console.warn('Geolocation failed:', error.message);
                let userMessage = 'Could not get precise location. ';
                switch(error.code) {
                    case 1: userMessage += "Permission denied. Please check your browser's site settings."; break;
                    case 2: userMessage += "Location is unavailable. Check your network or Wi-Fi connection."; break;
                    case 3: userMessage += "Request timed out. Trying to send with pincode as backup."; break;
                    default: userMessage += "An unknown error occurred."; break;
                }
                sosMessage.textContent = userMessage;
            }
            
            try {
                // --- CHANGED THIS LINE ---
                const response = await fetch('/api/server/request-blood', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        patientId: currentUser.user_id,
                        bloodType,
                        pincode,
                        latitude: location.latitude,
                        longitude: location.longitude
                    })
                });

                const result = await response.json();
                if (result.success) {
                    sosMessage.style.color = 'green';
                    sosMessage.textContent = result.message;
                    historySection.classList.remove('hidden');
                    fetchRequestHistory();
                } else {
                    sosMessage.style.color = 'red';
                    sosMessage.textContent = `Error: ${result.message}`;
                }
            } catch (error) {
                console.error('SOS request error:', error);
                sosMessage.textContent = 'Could not send SOS. Server may be down.';
            }
        }

        async function fetchRequestHistory() {
            historyBody.innerHTML = '<tr><td colspan="4">Loading...</td></tr>';
            try {
                // --- CHANGED THIS LINE ---
                const response = await fetch(`/api/server/requests/history/${currentUser.user_id}`);
                const requests = await response.json();
                historyBody.innerHTML = '';
                if (requests.length === 0) {
                    historyBody.innerHTML = '<tr><td colspan="4">No requests found.</td></tr>';
                } else {
                    requests.forEach(req => {
                        const row = historyBody.insertRow();
                        row.innerHTML = `
                            <td>${new Date(req.created_at).toLocaleString()}</td>
                            <td>${req.blood_type_needed}</td>
                            <td>${req.pincode || 'N/A'}</td>
                            <td>${req.status}</td>
                        `;
                    });
                }
            } catch (error) {
                historyBody.innerHTML = '<tr><td colspan="4">Could not load history.</td></tr>';
            }
        }
    </script>
</body>
</html>
