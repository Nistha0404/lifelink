<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Patient Dashboard - LifeLink</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .hidden { display:none; }
    .token-card { margin-top:16px; padding:12px; border:1px solid #e3e3e3; border-radius:8px; background:#fafafa; display:flex; gap:16px; align-items:center; }
    .token-pill { font-size:20px; font-weight:700; letter-spacing:2px; padding:8px 12px; border-radius:6px; background:#1a73e8; color:#fff; min-width:64px; text-align:center; }
    .qr-wrap img { width:128px; height:128px; }
    .qr-caption { font-size:12px; color:#555; margin-top:4px; }
    .main-card { max-width:880px;  }
    table { width:100%; border-collapse:collapse; }
    th, td { padding:8px 10px; border-bottom:1px solid #eee; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
</head>
<body>
<header>
  <div class="logo">
    <img src="lifeLinklogoD.png" alt="LifeLink Logo" class="new-logo-style">
    <span>LifeLink</span>
  </div>
  
  <nav><a href="#" id="logoutBtn">Logout</a></nav>
</header>

<main>
  <section class="main-card">
    <h2 id="welcome-message">Welcome!</h2>

    <div id="sos-section">
      <h3>Request Emergency Blood</h3>
      <p>Your precise location is primary. The pincode will be used as a backup.</p>
      <form id="sosForm">
        <div class="form-group">
          <label for="bloodType">Blood Type Needed:</label>
          <select id="bloodType" required>
            <option value="" disabled selected>-- Select --</option>
            <option value="A+">A+</option><option value="A-">A-</option>
            <option value="B+">B+</option><option value="B-">B-</option>
            <option value="O+">O+</option><option value="O-">O-</option>
            <option value="AB+">AB+</option><option value="AB-">AB-</option>
          </select>
        </div>
        <div class="form-group">
          <label for="pincode">Pincode (Required Backup):</label>
          <input type="text" id="pincode" placeholder="Enter 6-digit pincode" maxlength="6" required>
        </div>
        <button type="submit" id="sosBtn">Send SOS Alert</button>
      </form>
      <p id="sosMessage" class="message-area"></p>

      <!-- Patient Token + QR -->
      <div id="patientTokenCard" class="token-card hidden">
        <div>
          <div>Patient Verification Token</div>
          <div id="patientTokenText" class="token-pill">----</div>
          <div class="qr-caption">Show this token or QR at hospital for verification.</div>
        </div>
        <div class="qr-wrap">
          <img id="patientQrImg" alt="Patient Token QR" />
        </div>
      </div>
    </div>

    <div class="action-buttons" style="margin-top:16px;">
      <button id="historyBtn">View Request History</button>
      <button id="statusBtn">Refresh Status</button>
    </div>

    <div id="history-section" class="hidden">
      <h3>Your Request History</h3>
      <table id="history-table">
        <thead>
          <tr>
            <th>Date & Time</th>
            <th>Blood Type</th>
            <th>Pincode</th>
            <th>Status</th>
            <th>Token</th>
          </tr>
        </thead>
        <tbody id="history-body"></tbody>
      </table>
    </div>
  </section>
</main>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const user = JSON.parse(sessionStorage.getItem('currentUser'));
  if (!user) {
    window.location.href = 'patient-login.html';
    return;
  }

  document.getElementById('welcome-msg').textContent = `Welcome, ${user.full_name || 'Patient'}!`;

  const sosBtn = document.getElementById('sos-btn');
  const statusBox = document.getElementById('status-message');
  const historyContainer = document.getElementById('history-container');

  // Fetch past SOS requests
  async function loadHistory() {
    const res = await fetch(`/api/server/requests/history/${user.patient_id}`);
    const data = await res.json();
    historyContainer.innerHTML = '';
    if (!data.length) {
      historyContainer.innerHTML = '<p>No previous SOS requests.</p>';
      return;
    }
    data.forEach(req => {
      const item = document.createElement('div');
      item.classList.add('history-item');
      item.innerHTML = `
        <p><strong>Request ID:</strong> ${req.request_id}</p>
        <p>Status: ${req.status}</p>
        <p>Hospital: ${req.hospital_name || '—'}</p>
        <p>Date: ${new Date(req.created_at).toLocaleString()}</p>
      `;
      historyContainer.appendChild(item);
    });
  }

  sosBtn.addEventListener('click', async () => {
    if (!confirm('Do you want to send an SOS blood request?')) return;

    statusBox.textContent = 'Sending request...';
    try {
      const res = await fetch('/api/server/request-blood', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          patient_id: user.patient_id,
          latitude: user.latitude,
          longitude: user.longitude,
          pincode: user.pincode,
          blood_type: user.blood_type || 'O+'
        })
      });

      const data = await res.json();
      if (data.success) {
        statusBox.textContent = `Request sent successfully! Token: ${data.patient_token}`;
        statusBox.style.color = 'green';
        pollForStatus(data.requestId);
      } else {
        statusBox.textContent = data.message || 'Request failed.';
        statusBox.style.color = 'red';
      }
    } catch (err) {
      statusBox.textContent = 'Error contacting server.';
      statusBox.style.color = 'red';
    }
  });

  // Poll for hospital assignment
  async function pollForStatus(requestId) {
    const interval = setInterval(async () => {
      const res = await fetch(`/api/server/request-status/${requestId}`);
      const data = await res.json();

      if (data.status === 'accepted') {
        clearInterval(interval);
        statusBox.textContent = `Hospital assigned: ${data.hospital.name}, ${data.hospital.pincode}`;
        statusBox.style.color = 'green';
        loadHistory();
      } else if (data.status === 'rejected') {
        clearInterval(interval);
        statusBox.textContent = 'All hospitals rejected. Donor broadcast triggered.';
        statusBox.style.color = 'orange';
      }
    }, 15000);
  }

  loadHistory();
});
</script>

<footer>
        <p>© 2025 LifeLink</p>
    </footer>

</body>
</html>
