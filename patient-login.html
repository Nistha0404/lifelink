<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Patient Portal - LifeLink</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .hidden { display: none; }
    .message-area { margin-top: 10px; font-size: 14px; }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <img src="lifeLinklogoD.png" alt="LifeLink Logo" height="40">
      <span>LifeLink</span>
    </div>
    <nav><a href="../index.html">Home</a></nav>
  </header>

  <main>
    <section class="main-card">
      <h2>Patient Portal</h2>
      <form id="patientAuthForm">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" placeholder="Enter your full name" required>
        </div>

```
    <div class="form-group">
      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" placeholder="Enter 10-digit number" maxlength="10" required>
    </div>

    <div class="form-group">
      <label for="pincode">Pincode (for location backup)</label>
      <input type="text" id="pincode" placeholder="Enter 6-digit pincode" maxlength="6" required>
    </div>

    <button type="button" id="getOtpBtn">Get OTP</button>

    <div id="otpSection" class="hidden">
      <div class="form-group">
        <label for="otp">Enter OTP</label>
        <input type="text" id="otp" placeholder="Enter 4-digit OTP" maxlength="4">
      </div>
      <button type="button" id="verifyBtn">Verify & Proceed</button>
    </div>
  </form>
  <p id="message" class="message-area"></p>
</section>
```

  </main>

  <script>
  document.addEventListener('DOMContentLoaded', () => {
    const getOtpBtn = document.getElementById('getOtpBtn');
    const verifyBtn = document.getElementById('verifyBtn');
    const phoneInput = document.getElementById('phone');
    const otpInput = document.getElementById('otp');
    const msgBox = document.getElementById('message');
    const otpSection = document.getElementById('otpSection');
    const nameInput = document.getElementById('name');
    const pincodeInput = document.getElementById('pincode');

    let patientLocation = { lat: null, lon: null };

    // Capture location early
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(pos => {
        patientLocation.lat = pos.coords.latitude;
        patientLocation.lon = pos.coords.longitude;
      }, () => {
        console.warn("Location access denied. Using pincode fallback.");
      });
    }

    // --- Step 1: Send OTP ---
    getOtpBtn.addEventListener('click', async () => {
      const phone = phoneInput.value.trim();
      const name = nameInput.value.trim();
      const pincode = pincodeInput.value.trim();

      if (!phone || !name || !pincode) {
        msgBox.textContent = 'Please fill all fields before requesting OTP.';
        msgBox.style.color = 'red';
        return;
      }

      if (phone.length !== 10) {
        msgBox.textContent = 'Please enter a valid 10-digit phone number.';
        msgBox.style.color = 'red';
        return;
      }

      msgBox.textContent = 'Sending OTP...';
      msgBox.style.color = 'black';

      try {
        const res = await fetch('/api/server/send-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone_number: phone })
        });
        const data = await res.json();

        if (data.success) {
          msgBox.textContent = 'OTP sent successfully!';
          msgBox.style.color = 'green';
          otpSection.classList.remove('hidden');
        } else {
          msgBox.textContent = data.message || 'Failed to send OTP.';
          msgBox.style.color = 'red';
        }
      } catch (err) {
        msgBox.textContent = 'Error contacting server.';
        msgBox.style.color = 'red';
      }
    });

    // --- Step 2: Verify OTP ---
    verifyBtn.addEventListener('click', async () => {
      const phone = phoneInput.value.trim();
      const otp = otpInput.value.trim();
      const name = nameInput.value.trim();
      const pincode = pincodeInput.value.trim();

      if (!phone || !otp) {
        msgBox.textContent = 'Please enter both phone number and OTP.';
        msgBox.style.color = 'red';
        return;
      }

      if (otp.length !== 4) {
        msgBox.textContent = 'Please enter a valid 4-digit OTP.';
        msgBox.style.color = 'red';
        return;
      }

      msgBox.textContent = 'Verifying OTP...';
      msgBox.style.color = 'black';

      try {
        const res = await fetch('/api/server/patient-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            phone_number: phone,
            otp,
            full_name: name,
            pincode,
            latitude: patientLocation.lat,
            longitude: patientLocation.lon
          })
        });

        const data = await res.json();

        if (data.success) {
          msgBox.textContent = 'Login successful! Redirecting...';
          msgBox.style.color = 'green';
          sessionStorage.setItem('currentUser', JSON.stringify(data.user));
          setTimeout(() => {
            window.location.href = 'patient-dashboard.html';
          }, 1500);
        } else {
          msgBox.textContent = data.message || 'Invalid OTP.';
          msgBox.style.color = 'red';
        }
      } catch (err) {
        msgBox.textContent = 'Error verifying OTP.';
        msgBox.style.color = 'red';
      }
    });
  });
  </script>

  <footer>
    <p>© 2025 LifeLink</p>
  </footer>
</body>
</html>
