<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Volunteer Dashboard - LifeLink Enhanced</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .tabs { display: flex; border-bottom: 2px solid #2a5c60; margin-bottom: 20px; }
    .tab-btn { flex: 1; padding: 12px; border: none; background: #f0f0f0; cursor: pointer; font-weight: 600; }
    .tab-btn.active { background: #2a5c60; color: white; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .drive-card { background: white; border: 1px solid #ddd; border-radius: 12px; padding: 20px; margin-bottom: 15px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    .drive-card h4 { margin: 0 0 10px 0; color: #2a5c60; }
    .drive-card .date-badge { display: inline-block; padding: 5px 12px; background: #2196f3; color: white; border-radius: 20px; font-size: 0.9rem; }
    .role-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin: 15px 0; }
    .role-card { padding: 15px; border: 2px solid #ddd; border-radius: 8px; text-align: center; cursor: pointer; transition: all 0.3s; }
    .role-card:hover { border-color: #2a5c60; background: #e8f5e9; transform: translateY(-2px); }
    .role-card.selected { border-color: #4caf50; background: #c8e6c9; }
    .shift-selector { display: flex; gap: 10px; margin: 15px 0; }
    .shift-btn { padding: 10px 20px; border: 2px solid #ddd; background: white; border-radius: 8px; cursor: pointer; }
    .shift-btn.selected { border-color: #2a5c60; background: #2a5c60; color: white; }
    .assignment-item { background: #f9f9f9; border-left: 4px solid #2a5c60; padding: 12px; margin-bottom: 10px; border-radius: 4px; }
    .material-card { background: white; border: 1px solid #ddd; padding: 20px; border-radius: 8px; text-align: center; }
    .material-preview { width: 100%; max-width: 400px; height: 300px; border: 2px dashed #ccc; margin: 20px auto; display: flex; align-items: center; justify-content: center; background: #f9f9f9; }
  </style>
</head>
<body>
<header>
  <div class="logo"><img src="lifeLinklogoD.png" alt="LifeLink Logo"><span>LifeLink</span></div>
  <nav><a href="#" id="logoutBtn">Logout</a></nav>
</header>

<main>
  <section class="dashboard-container">
    <div class="dashboard-header">
      <h2 id="welcome-message">Volunteer Dashboard</h2>
    </div>

    <!-- TABS -->
    <div class="tabs">
      <button class="tab-btn active" onclick="showTab('drives')">Blood Drives</button>
      <button class="tab-btn" onclick="showTab('my-shifts')">My Shifts</button>
      <button class="tab-btn" onclick="showTab('create-drive')">Create Drive</button>
      <button class="tab-btn" onclick="showTab('awareness')">Awareness Kit</button>
    </div>

    <!-- TAB 1: UPCOMING DRIVES -->
    <div id="tab-drives" class="tab-content active">
      <h3>Upcoming Blood Donation Drives</h3>
      <button onclick="refreshDrives()" class="btn-secondary">🔄 Refresh</button>
      <div id="drives-list"></div>
    </div>

    <!-- TAB 2: MY ASSIGNMENTS -->
    <div id="tab-my-shifts" class="tab-content">
      <h3>My Shift Assignments</h3>
      <div id="assignments-list"></div>
    </div>

    <!-- TAB 3: CREATE DRIVE (NGO Only) -->
    <div id="tab-create-drive" class="tab-content">
      <h3>Create New Blood Drive</h3>
      <form id="create-drive-form">
        <div class="form-group">
          <label>Drive Name</label>
          <input type="text" id="drive-name" required placeholder="e.g., Community Blood Drive 2025">
        </div>
        <div class="form-group">
          <label>Location</label>
          <input type="text" id="drive-location" required placeholder="Full address">
        </div>
        <div class="form-group">
          <label>Start Date</label>
          <input type="date" id="drive-start-date" required>
        </div>
        <div class="form-group">
          <label>End Date (Optional)</label>
          <input type="date" id="drive-end-date">
        </div>
        <div class="form-group">
          <label>Start Time</label>
          <input type="time" id="drive-start-time" required>
        </div>
        <div class="form-group">
          <label>End Time</label>
          <input type="time" id="drive-end-time" required>
        </div>
        <div class="form-group">
          <label>Target Donors</label>
          <input type="number" id="drive-target" min="1" value="50" required>
        </div>
        
        <h4>Required Roles</h4>
        <div id="roles-container">
          <div class="role-input">
            <input type="text" placeholder="Role name (e.g., Registration Desk)" class="role-name">
            <input type="number" placeholder="# needed" min="1" class="role-count">
          </div>
        </div>
        <button type="button" onclick="addRoleInput()" class="btn-secondary">+ Add Role</button>
        
        <button type="submit" class="btn-primary" style="width: 100%; margin-top: 20px;">Create Drive</button>
      </form>
      <p id="drive-create-message" class="message-area"></p>
    </div>

    <!-- TAB 4: AWARENESS KIT -->
    <div id="tab-awareness" class="tab-content">
      <h3>Generate Awareness Materials</h3>
      <div class="material-card">
        <h4>Create Poster/QR Code</h4>
        <form id="awareness-form">
          <div class="form-group">
            <label>Material Type</label>
            <select id="material-type">
              <option value="Poster">Poster</option>
              <option value="QR Code">QR Code Only</option>
              <option value="Social Media">Social Media Tile</option>
            </select>
          </div>
          <div class="form-group">
            <label>Title/Message</label>
            <input type="text" id="material-title" placeholder="e.g., Donate Blood, Save Lives!" required>
          </div>
          <button type="submit" class="btn-primary" style="width: 100%;">Generate Material</button>
        </form>
        <p id="awareness-message" class="message-area"></p>
        
        <div id="material-preview" class="material-preview" style="display: none;">
          <p>Preview will appear here</p>
        </div>
        
        <div id="material-actions" style="display: none; margin-top: 20px;">
          <button onclick="downloadMaterial()" class="btn-success">📥 Download</button>
          <button onclick="copyLink()" class="btn-secondary">🔗 Copy Link</button>
        </div>
      </div>
    </div>
  </section>
</main>

<!-- DRIVE SIGNUP MODAL -->
<div id="signup-modal" style="display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5);">
  <div style="background: white; margin: 10% auto; padding: 30px; border-radius: 12px; width: 90%; max-width: 600px;">
    <h3 id="modal-drive-name">Sign Up for Drive</h3>
    <h4>Select Your Role</h4>
    <div id="modal-roles" class="role-grid"></div>
    
    <h4 style="margin-top: 20px;">Select Your Shift</h4>
    <div class="shift-selector">
      <button class="shift-btn" data-shift="morning">Morning (9am-1pm)</button>
      <button class="shift-btn" data-shift="afternoon">Afternoon (1pm-5pm)</button>
      <button class="shift-btn" data-shift="full">Full Day (9am-5pm)</button>
    </div>
    
    <div style="margin-top: 20px; display: flex; gap: 10px;">
      <button onclick="confirmSignup()" class="btn-primary" style="flex: 1;">Confirm Sign Up</button>
      <button onclick="closeSignupModal()" class="btn-secondary" style="flex: 1;">Cancel</button>
    </div>
  </div>
</div>

<script>
let volunteer = null;
let currentDrive = null;
let selectedRole = null;
let selectedShift = null;
let generatedMaterial = null;

document.addEventListener('DOMContentLoaded', () => {
  volunteer = JSON.parse(sessionStorage.getItem('currentUserInfo'));
  if (!volunteer) {
    window.location.href = 'volunteer-login.html';
    return;
  }

  document.getElementById('welcome-message').textContent = `Welcome, ${volunteer.full_name}!`;
  
  // Show/hide create drive tab based on role
  if (volunteer.role !== 'ngo') {
    document.querySelector('[onclick="showTab(\'create-drive\')"]').style.display = 'none';
  }
  
  // Set min date
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('drive-start-date').setAttribute('min', today);
  document.getElementById('drive-end-date').setAttribute('min', today);
  
  // Load data
  refreshDrives();
  loadMyAssignments();
  
  // Forms
  document.getElementById('create-drive-form').addEventListener('submit', createDrive);
  document.getElementById('awareness-form').addEventListener('submit', generateAwareness);
  
  // Shift selection
  document.querySelectorAll('.shift-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.shift-btn').forEach(b => b.classList.remove('selected'));
      this.classList.add('selected');
      selectedShift = this.dataset.shift;
    });
  });
  
  document.getElementById('logoutBtn').addEventListener('click', () => {
    sessionStorage.clear();
    window.location.href = 'volunteer-login.html';
  });
});

function showTab(tabName) {
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById(`tab-${tabName}`).classList.add('active');
}

// LOAD DRIVES
async function refreshDrives() {
  try {
    const response = await fetch('/api/volunteer/drives');
    const data = await response.json();
    const container = document.getElementById('drives-list');
    
    if (!data.success || !data.drives.length) {
      container.innerHTML = '<p style="text-align: center; color: #999; padding: 20px;">No upcoming drives.</p>';
      return;
    }
    
    container.innerHTML = '';
    data.drives.forEach(drive => {
      const div = document.createElement('div');
      div.className = 'drive-card';
      div.innerHTML = `
        <h4>${drive.drive_name}</h4>
        <span class="date-badge">${new Date(drive.start_date).toLocaleDateString()}</span>
        <p><strong>Location:</strong> ${drive.location}</p>
        <p><strong>Time:</strong> ${drive.start_time} - ${drive.end_time}</p>
        <p><strong>Organized by:</strong> ${drive.organizer_name}</p>
        <p><strong>Target:</strong> ${drive.target_donors} donors | Registered: ${drive.registered_donors || 0}</p>
        <button onclick="openSignupModal(${drive.drive_id}, '${drive.drive_name}')" class="btn-primary">Sign Up as Volunteer</button>
      `;
      container.appendChild(div);
    });
  } catch (error) {
    console.error(error);
  }
}

// SIGNUP MODAL
function openSignupModal(driveId, driveName) {
  currentDrive = driveId;
  document.getElementById('modal-drive-name').textContent = `Sign Up: ${driveName}`;
  
  // Load roles for this drive
  const rolesGrid = document.getElementById('modal-roles');
  rolesGrid.innerHTML = `
    <div class="role-card" onclick="selectRole(1, this)">
      <h4>Registration Desk</h4>
      <p>Check-in donors</p>
    </div>
    <div class="role-card" onclick="selectRole(2, this)">
      <h4>Guide</h4>
      <p>Assist donors</p>
    </div>
    <div class="role-card" onclick="selectRole(3, this)">
      <h4>Refreshments</h4>
      <p>Serve snacks</p>
    </div>
    <div class="role-card" onclick="selectRole(4, this)">
      <h4>Coordinator</h4>
      <p>Oversee operations</p>
    </div>
  `;
  
  document.getElementById('signup-modal').style.display = 'block';
}

function selectRole(roleId, element) {
  document.querySelectorAll('.role-card').forEach(card => card.classList.remove('selected'));
  element.classList.add('selected');
  selectedRole = roleId;
}

function closeSignupModal() {
  document.getElementById('signup-modal').style.display = 'none';
  selectedRole = null;
  selectedShift = null;
}

async function confirmSignup() {
  if (!selectedRole) {
    alert('Please select a role');
    return;
  }
  if (!selectedShift) {
    alert('Please select a shift');
    return;
  }
  
  const shiftTimes = {
    morning: { start: '09:00', end: '13:00' },
    afternoon: { start: '13:00', end: '17:00' },
    full: { start: '09:00', end: '17:00' }
  };
  
  try {
    const response = await fetch('/api/volunteer/drive-signup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        volunteerId: volunteer.user_id,
        roleId: selectedRole,
        shiftStart: shiftTimes[selectedShift].start,
        shiftEnd: shiftTimes[selectedShift].end
      })
    });
    
    const result = await response.json();
    
    if (result.success) {
      alert('✅ Signed up successfully!');
      closeSignupModal();
      loadMyAssignments();
    } else {
      alert(`❌ ${result.message}`);
    }
  } catch (error) {
    console.error(error);
    alert('❌ Server error');
  }
}

// MY ASSIGNMENTS
async function loadMyAssignments() {
  try {
    const response = await fetch(`/api/volunteer/my-assignments/${volunteer.user_id}`);
    const data = await response.json();
    const container = document.getElementById('assignments-list');
    
    if (!data.success || !data.assignments.length) {
      container.innerHTML = '<p style="text-align: center; color: #999; padding: 20px;">No assignments yet.</p>';
      return;
    }
    
    container.innerHTML = '';
    data.assignments.forEach(assignment => {
      const div = document.createElement('div');
      div.className = 'assignment-item';
      div.innerHTML = `
        <strong>${assignment.drive_name}</strong><br>
        Role: ${assignment.role_name} | ${assignment.location}<br>
        Date: ${new Date(assignment.start_date).toLocaleDateString()} | ${assignment.shift_start} - ${assignment.shift_end}<br>
        Status: ${assignment.status}
      `;
      container.appendChild(div);
    });
  } catch (error) {
    console.error(error);
  }
}

// CREATE DRIVE
function addRoleInput() {
  const container = document.getElementById('roles-container');
  const div = document.createElement('div');
  div.className = 'role-input';
  div.style.marginTop = '10px';
  div.innerHTML = `
    <input type="text" placeholder="Role name" class="role-name">
    <input type="number" placeholder="# needed" min="1" class="role-count">
  `;
  container.appendChild(div);
}

async function createDrive(e) {
  e.preventDefault();
  const messageEl = document.getElementById('drive-create-message');
  messageEl.textContent = 'Creating drive...';
  
  const roles = [];
  document.querySelectorAll('.role-input').forEach(input => {
    const name = input.querySelector('.role-name').value;
    const count = input.querySelector('.role-count').value;
    if (name && count) {
      roles.push({ name, required: parseInt(count) });
    }
  });
  
  try {
    const response = await fetch('/api/volunteer/drive-create', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        organizerId: volunteer.user_id,
        driveName: document.getElementById('drive-name').value,
        location: document.getElementById('drive-location').value,
        startDate: document.getElementById('drive-start-date').value,
        endDate: document.getElementById('drive-end-date').value || null,
        startTime: document.getElementById('drive-start-time').value,
        endTime: document.getElementById('drive-end-time').value,
        targetDonors: document.getElementById('drive-target').value,
        roles
      })
    });
    
    const result = await response.json();
    
    if (result.success) {
      messageEl.textContent = '✅ Drive created successfully!';
      messageEl.className = 'message-area message-success';
      document.getElementById('create-drive-form').reset();
      refreshDrives();
    } else {
      messageEl.textContent = `❌ ${result.message}`;
      messageEl.className = 'message-area message-error';
    }
  } catch (error) {
    console.error(error);
    messageEl.textContent = '❌ Server error';
    messageEl.className = 'message-area message-error';
  }
}

// AWARENESS KIT
async function generateAwareness(e) {
  e.preventDefault();
  const messageEl = document.getElementById('awareness-message');
  messageEl.textContent = 'Generating material...';
  
  try {
    const response = await fetch('/api/awareness/generate-material', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        createdBy: volunteer.user_id,
        materialType: document.getElementById('material-type').value,
        title: document.getElementById('material-title').value
      })
    });
    
    const result = await response.json();
    
    if (result.success) {
      generatedMaterial = result.material;
      messageEl.textContent = '✅ Material generated!';
      messageEl.className = 'message-area message-success';
      
      const preview = document.getElementById('material-preview');
      preview.style.display = 'flex';
      preview.innerHTML = `<img src="${result.material.content_url}" alt="Preview" style="max-width: 100%;">`;
      
      document.getElementById('material-actions').style.display = 'block';
    } else {
      messageEl.textContent = `❌ ${result.message}`;
      messageEl.className = 'message-area message-error';
    }
  } catch (error) {
    console.error(error);
    messageEl.textContent = '❌ Server error';
    messageEl.className = 'message-area message-error';
  }
}

function downloadMaterial() {
  if (!generatedMaterial) return;
  const link = document.createElement('a');
  link.href = generatedMaterial.content_url;
  link.download = `${generatedMaterial.title}.svg`;
  link.click();
}

function copyLink() {
  if (!generatedMaterial) return;
  navigator.clipboard.writeText(generatedMaterial.qr_code_data);
  alert('✅ Link copied to clipboard!');
}
</script>

<footer><p>© 2025 LifeLink</p></footer>
</body>
</html>
