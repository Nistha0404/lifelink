<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Volunteer Dashboard - LifeLink</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <header>
    <div class="logo"><img src="lifeLinklogoD.png" alt="LifeLink Logo"><span>LifeLink</span></div>
    <nav><a href="#" onclick="sessionStorage.clear(); window.location.href='volunteer-login.html';">Logout</a></nav>
  </header>
  <main>
    <section class="dashboard-container">
      <div class="dashboard-header">
        <h2 id="welcome-message">Volunteer & NGO Dashboard</h2>
      </div>
      <div class="dashboard-grid">
        <div class="dashboard-card">
          <h3>Upcoming Donation Camps</h3>
          <div id="camps-list">
             <p>Loading upcoming camps...</p>
          </div>
        </div>
        </div>
    </section>
  </main>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
        const userName = sessionStorage.getItem('currentUserName');
        if (userName) {
            document.getElementById('welcome-message').textContent = `Welcome, ${userName}!`;
        } else {
            window.location.href = 'volunteer-login.html';
        }
        fetchCamps();
    });

    async function fetchCamps() {
        const listEl = document.getElementById('camps-list');
        try {
            // --- CHANGED THIS LINE ---
            const response = await fetch('/api/server/camps');
            const camps = await response.json();
            listEl.innerHTML = '';
            if (camps.length === 0) {
                listEl.innerHTML = '<p>No upcoming camps scheduled.</p>';
                return;
            }
            camps.forEach(camp => {
                const item = document.createElement('div');
                item.classList.add('camp-item'); // Add a class for styling
                item.innerHTML = `
                    <h4>${camp.camp_name}</h4>
                    <p><strong>Date:</strong> ${new Date(camp.camp_date).toLocaleDateString()}</p>
                    <p><strong>Location:</strong> ${camp.address}</p>
                    <p><em>Organized by: ${camp.ngo_name}</em></p>
                `;
                listEl.appendChild(item);
            });
        } catch (error) {
            listEl.innerHTML = '<p>Error loading camps.</p>';
        }
    }
  </script>

  <footer>
        <p>© 2025 LifeLink</p>
    </footer>

</body>
</html>
