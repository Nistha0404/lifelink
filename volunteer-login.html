<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volunteer & NGO Portal - LifeLink</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    
    <style>
        .auth-page {
            min-height: 100vh;
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: var(--neutral-50);
        }
        
        .auth-sidebar {
            background: var(--gradient-primary);
            padding: var(--space-12);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            color: white;
            position: relative;
            overflow: hidden;
        }
        
        .auth-sidebar::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
            pointer-events: none;
        }
        
        .auth-sidebar-content {
            position: relative;
            z-index: 1;
        }
        
        .auth-sidebar h2 {
            font-size: var(--text-4xl);
            color: white;
            margin-bottom: var(--space-4);
        }
        
        .auth-sidebar p {
            font-size: var(--text-lg);
            color: rgba(255, 255, 255, 0.9);
            line-height: var(--leading-relaxed);
        }

        .auth-logo {
            display: flex;
            align-items: center;
            gap: var(--space-3);
            font-size: var(--text-2xl);
            font-weight: var(--font-bold);
            color: var(--primary-600);
            margin-bottom: var(--space-8);
            text-decoration: none;
        }

        .auth-logo img {
            height: 40px;
            width: auto;
        }
        
        .auth-content {
            padding: var(--space-12);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .auth-header {
            margin-bottom: var(--space-8);
        }
        
        .auth-title {
            font-size: var(--text-3xl);
            margin-bottom: var(--space-3);
        }
        
        .auth-subtitle {
            color: var(--neutral-600);
            font-size: var(--text-base);
        }
        
        .auth-tabs {
            display: flex;
            gap: var(--space-2);
            background: var(--neutral-100);
            padding: var(--space-1);
            border-radius: var(--radius-lg);
            margin-bottom: var(--space-8);
        }
        
        .auth-tab {
            flex: 1;
            padding: var(--space-3) var(--space-4);
            background: transparent;
            border: none;
            border-radius: var(--radius-md);
            font-size: var(--text-sm);
            font-weight: var(--font-medium);
            color: var(--neutral-600);
            cursor: pointer;
            transition: all var(--transition-fast);
        }
        
        .auth-tab.active {
            background: white;
            color: var(--primary-600);
            box-shadow: var(--shadow-sm);
        }
        
        .auth-form {
            max-width: 400px;
        }
        
        .auth-footer {
            margin-top: var(--space-6);
            text-align: center;
            font-size: var(--text-sm);
            color: var(--neutral-600);
        }
        
        .auth-footer a {
            color: var(--primary-600);
            font-weight: var(--font-medium);
        }
        
        .message-success {
            padding: var(--space-4);
            background: var(--success-light);
            color: var(--success);
            border-radius: var(--radius-lg);
            margin-bottom: var(--space-4);
            border: 1px solid var(--success);
        }
        
        .message-error {
            padding: var(--space-4);
            background: var(--error-light);
            color: var(--error);
            border-radius: var(--radius-lg);
            margin-bottom: var(--space-4);
            border: 1px solid var(--error);
        }
        
        .resend-otp-btn {
            margin-top: var(--space-3);
            font-size: var(--text-sm);
            color: var(--primary-600);
            background: none;
            border: none;
            cursor: pointer;
            text-decoration: underline;
            padding: 0;
            display: block;
        }
        .resend-otp-btn:hover {
            color: var(--primary-700);
        }
        .resend-otp-btn:disabled {
            color: var(--neutral-400);
            cursor: not-allowed;
        }
        
        @media (max-width: 1024px) {
            .auth-page {
                grid-template-columns: 1fr;
            }
            
            .auth-sidebar {
                display: none;
            }
            
            .auth-content {
                padding: var(--space-8) var(--space-6);
            }
        }
    </style>
</head>
<body>
    <div class="auth-page">
        <div class="auth-sidebar">
            <div class="auth-sidebar-content">
                <a href="index.html" class="auth-logo" style="color: white;">
                    <img src="lifeLinklogoD.png" alt="LifeLink Logo" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2240%22 height=%2240%22><circle cx=%2220%22 cy=%2220%22 r=%2218%22 fill=%22white%22 opacity=%220.2%22/><path d=%22M20 8v12M14 14h12%22 stroke=%22white%22 stroke-width=%223%22 stroke-linecap=%22round%22/></svg>'">
                    <span>LifeLink</span>
                </a>
                
                <h2>Make an Impact</h2>
                <p>
                    Join our volunteer network and help organize blood donation drives that save lives.
                </p>
            </div>
            
            <p style="font-size: var(--text-sm); opacity: 0.8;">
                © 2025 LifeLink. All rights reserved.
            </p>
        </div>
        
        <div class="auth-content">
            <div class="auth-header">
                <a href="index.html" class="auth-logo">
                    <img src="lifeLinklogoD.png" alt="LifeLink Logo" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2240%22 height=%2240%22><circle cx=%2220%22 cy=%2220%22 r=%2218%22 fill=%22%23f43f5e%22/><path d=%22M20 8v12M14 14h12%22 stroke=%22white%22 stroke-width=%223%22 stroke-linecap=%22round%22/></svg>'">
                    <span>LifeLink</span>
                </a>
                
                <h1 class="auth-title">Volunteer & NGO Portal</h1>
                <p class="auth-subtitle">Register or log in to coordinate and save lives.</p>
            </div>
            
            <div class="auth-tabs">
                <button class="auth-tab active" id="volunteer-tab-btn" onclick="showTab('volunteer')">Individual Volunteer</button>
                <button class="auth-tab" id="ngo-tab-btn" onclick="showTab('ngo')">NGO / Organization</button>
            </div>

            <div class="auth-form-container">
                <div id="volunteerFormContainer">
                    <form id="volunteerLoginForm" class="auth-form">
                        <div class="form-group">
                            <label class="form-label" for="volunteerName">Full Name <span class="required">*</span></label>
                            <input type="text" id="volunteerName" class="form-input" placeholder="Enter your full name" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="volunteerPhone">Phone Number <span class="required">*</span></label>
                            <input type="tel" id="volunteerPhone" class="form-input" placeholder="Enter 10-digit number for OTP" maxlength="10" required>
                        </div>
                        <button type="button" id="getVolunteerOtpBtn" class="btn btn-primary" style="width: 100%;">Get OTP</button>
                    </form>
                </div>

                <div id="ngoFormContainer" style="display:none;">
                    <form id="ngoLoginForm" class="auth-form">
                        <div class="form-group">
                            <label class="form-label" for="ngoName">Organization Name <span class="required">*</span></label>
                            <input type="text" id="ngoName" class="form-input" placeholder="Enter the organization's name" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="ngoRegId">Registration ID <span class="required">*</span></label>
                            <input type="text" id="ngoRegId" class="form-input" placeholder="Enter official registration ID" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="ngoPhone">Contact Phone <span class="required">*</span></label>
                            <input type="tel" id="ngoPhone" class="form-input" placeholder="Enter 10-digit number for OTP" maxlength="10" required>
                        </div>
                        <button type="button" id="getNgoOtpBtn" class="btn btn-primary" style="width: 100%;">Get OTP</button>
                    </form>
                </div>
                
                <div id="otpSection" style="display:none; margin-top: var(--space-6);">
                    <div class="form-group">
                        <label class="form-label" for="otp">Enter OTP <span class="required">*</span></label>
                        <input type="text" id="otp" class="form-input" placeholder="Enter 4-digit OTP" maxlength="4" inputmode="numeric" required>
                    </div>
                    <button type="button" id="verifyBtn" class="btn btn-primary" style="width: 100%;">Verify & Login</button>
                    <button type="button" id="resendOtpBtn" class="resend-otp-btn">Resend OTP</button>
                </div>

                <div id="message"></div>
                
                <div class="auth-footer">
                    <p>
                        <a href="index.html">← Back to Home</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
    
    <script>
    let currentUserType = 'volunteer';

    const messageEl = document.getElementById('message');
    const otpSection = document.getElementById('otpSection');
    const volunteerFormContainer = document.getElementById('volunteerFormContainer');
    const ngoFormContainer = document.getElementById('ngoFormContainer');
    const getVolunteerOtpBtn = document.getElementById('getVolunteerOtpBtn');
    const getNgoOtpBtn = document.getElementById('getNgoOtpBtn');
    const resendOtpBtn = document.getElementById('resendOtpBtn');
    const verifyBtn = document.getElementById('verifyBtn');

    function showMessage(text, type) {
        messageEl.textContent = text;
        messageEl.className = type === 'success' ? 'message-success' : 'message-error';
        messageEl.style.display = 'block';
    }

    function showTab(tabName) {
        currentUserType = tabName;
        
        volunteerFormContainer.style.display = (currentUserType === 'volunteer') ? 'block' : 'none';
        ngoFormContainer.style.display = (currentUserType === 'ngo') ? 'block' : 'none';
        
        document.getElementById('volunteer-tab-btn').classList.toggle('active', currentUserType === 'volunteer');
        document.getElementById('ngo-tab-btn').classList.toggle('active', currentUserType === 'ngo');
        
        otpSection.style.display = 'none';
        messageEl.style.display = 'none';
        getVolunteerOtpBtn.style.display = 'block';
        getNgoOtpBtn.style.display = 'block';
    }

    // Handle OTP generation
    async function handleGetOtp() {
        let phone, btn, formValid = true;
        let fullName, ngoName, registrationId;

        if (currentUserType === 'volunteer') {
            fullName = document.getElementById('volunteerName').value.trim();
            phone = document.getElementById('volunteerPhone').value.trim();
            btn = getVolunteerOtpBtn;
            if (!fullName) formValid = false;
        } else {
            ngoName = document.getElementById('ngoName').value.trim();
            registrationId = document.getElementById('ngoRegId').value.trim();
            phone = document.getElementById('ngoPhone').value.trim();
            btn = getNgoOtpBtn;
            if (!ngoName || !registrationId) formValid = false;
        }

        if (!formValid) {
            showMessage("Please fill in all required fields.", 'error');
            return;
        }
        if (!/^\d{10}$/.test(phone)) {
            showMessage("Please enter a valid 10-digit phone number.", 'error');
            return;
        }

        btn.disabled = true;
        btn.textContent = 'Sending OTP...';
        messageEl.style.display = 'none';

        try {
            const response = await fetch('/api/server/volunteer/send-otp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phoneNumber: phone })
            });

            const result = await response.json();

            if (result.success) {
                // Show OTP in alert popup
                alert(`📱 Your OTP is: ${result.otp}\n\n(In production, this will be sent via SMS)`);
                showMessage('OTP sent! Check the popup alert.', 'success');
                
                otpSection.style.display = 'block';
                btn.style.display = 'none';
                
                // Disable form inputs
                if (currentUserType === 'volunteer') {
                    document.getElementById('volunteerName').disabled = true;
                    document.getElementById('volunteerPhone').disabled = true;
                } else {
                    document.getElementById('ngoName').disabled = true;
                    document.getElementById('ngoRegId').disabled = true;
                    document.getElementById('ngoPhone').disabled = true;
                }
            } else {
                showMessage(result.message || 'Failed to send OTP', 'error');
                btn.disabled = false;
                btn.textContent = 'Get OTP';
            }

        } catch (error) {
            console.error('OTP Error:', error);
            showMessage('Could not connect to the server. Please try again.', 'error');
            btn.disabled = false;
            btn.textContent = 'Get OTP';
        }
    }

    // Resend OTP
    resendOtpBtn.addEventListener('click', async () => {
        let phone;
        
        if (currentUserType === 'volunteer') {
            phone = document.getElementById('volunteerPhone').value.trim();
        } else {
            phone = document.getElementById('ngoPhone').value.trim();
        }

        resendOtpBtn.disabled = true;
        resendOtpBtn.textContent = 'Resending...';

        try {
            const response = await fetch('/api/server/volunteer/send-otp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phoneNumber: phone })
            });

            const result = await response.json();

            if (result.success) {
                alert(`📱 Your OTP is: ${result.otp}\n\n(In production, this will be sent via SMS)`);
                showMessage('OTP resent! Check the popup alert.', 'success');
                resendOtpBtn.disabled = false;
                resendOtpBtn.textContent = 'Resend OTP';
            } else {
                showMessage(result.message || 'Failed to resend OTP', 'error');
                resendOtpBtn.disabled = false;
                resendOtpBtn.textContent = 'Resend OTP';
            }
        } catch (error) {
            showMessage('Could not connect to the server.', 'error');
            resendOtpBtn.disabled = false;
            resendOtpBtn.textContent = 'Resend OTP';
        }
    });

    // Verify and Login
    verifyBtn.addEventListener('click', async () => {
        const otp = document.getElementById('otp').value.trim();
        let phone, fullName, ngoName, registrationId;

        if (otp.length !== 4) {
            showMessage('Please enter the 4-digit OTP.', 'error');
            return;
        }

        if (currentUserType === 'volunteer') {
            fullName = document.getElementById('volunteerName').value.trim();
            phone = document.getElementById('volunteerPhone').value.trim();
            ngoName = '';
            registrationId = '';
        } else {
            ngoName = document.getElementById('ngoName').value.trim();
            registrationId = document.getElementById('ngoRegId').value.trim();
            phone = document.getElementById('ngoPhone').value.trim();
            fullName = '';
        }

        verifyBtn.disabled = true;
        verifyBtn.textContent = 'Verifying...';

        try {
            const response = await fetch('/api/server/volunteer-login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    phoneNumber: phone,
                    fullName: fullName,
                    ngoName: ngoName,
                    registrationId: registrationId,
                    type: currentUserType,
                    otp: otp
                })
            });

            const result = await response.json();

            if (result.success) {
                sessionStorage.setItem('currentUser', JSON.stringify(result.user));
                showMessage('Login successful! Redirecting...', 'success');
                setTimeout(() => {
                    window.location.href = 'volunteer-dashboard.html';
                }, 1500);
            } else {
                showMessage(`Login failed: ${result.message}`, 'error');
                verifyBtn.disabled = false;
                verifyBtn.textContent = 'Verify & Login';
            }
        } catch (error) {
            console.error('Verification Error:', error);
            showMessage('Could not connect to the server. Please try again.', 'error');
            verifyBtn.disabled = false;
            verifyBtn.textContent = 'Verify & Login';
        }
    });

    // Attach event listeners
    getVolunteerOtpBtn.addEventListener('click', handleGetOtp);
    getNgoOtpBtn.addEventListener('click', handleGetOtp);
    </script>
</body>
</html>
