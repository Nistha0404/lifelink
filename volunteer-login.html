<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volunteer & NGO Portal - LifeLink</title>
     <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">
            <span> <img src=lifeLinklogoD.png > </span>
            <span>LifeLink</span>
        </div>
        <nav>
            <a href="index.html">Home</a>
        </nav>
    </header>

    <main>
        <section class="main-card">
            <h2>Volunteer & NGO Portal</h2>
            <p>Register or log in to coordinate and save lives.</p>

            <div class="form-group">
                <label for="userType">I am a/an:</label>
                <select id="userType" onchange="toggleRegistrationForm()">
                    <option value="volunteer">Individual Volunteer</option>
                    <option value="ngo">NGO / Organization</option>
                </select>
            </div>

            <div id="volunteerFormContainer">
                <form id="volunteerLoginForm">
                    <div class="form-group">
                        <label for="volunteerName">Full Name</label>
                        <input type="text" id="volunteerName" placeholder="Enter your full name" required>
                    </div>
                    <div class="form-group">
                        <label for="volunteerPhone">Phone Number</label>
                        <input type="tel" id="volunteerPhone" placeholder="Enter 10-digit number for OTP" maxlength="10" required>
                    </div>
                    <button type="button" id="getVolunteerOtpBtn" class="btn-primary">Get OTP</button>
                </form>
            </div>

            <div id="ngoFormContainer" style="display:none;">
                <form id="ngoLoginForm">
                    <div class="form-group">
                        <label for="ngoName">Organization Name</label>
                        <input type="text" id="ngoName" placeholder="Enter the organization's name" required>
                    </div>
                     <div class="form-group">
                        <label for="ngoRegId">Registration ID</label>
                        <input type="text" id="ngoRegId" placeholder="Enter official registration ID" required>
                    </div>
                    <div class="form-group">
                        <label for="ngoPhone">Contact Phone</label>
                        <input type="tel" id="ngoPhone" placeholder="Enter 10-digit number for OTP" maxlength="10" required>
                    </div>
                    <button type="button" id="getNgoOtpBtn" class="btn-primary">Get OTP</button>
                </form>
            </div>
            
            <div id="otpSection" style="display:none;">
                <div class="info-box">
                    ✅ An OTP has been sent to your mobile number.
                </div>
                <div class="form-group">
                    <label for="otp">Enter OTP</label>
                    <input type="text" id="otp" placeholder="Enter 6-digit OTP" maxlength="6" required>
                </div>
                <button type="button" id="verifyBtn" class="btn-primary">Verify & Login</button>
            </div>

            <div id="message"></div>
        </section>
    </main>

    <script>
    let currentUserType = 'volunteer';

    const messageEl = document.getElementById('message');
    const otpSection = document.getElementById('otpSection');

    function showMessage(text, type) {
      messageEl.textContent = text;
      messageEl.className = type;
      messageEl.style.display = 'block';
    }

    function toggleRegistrationForm() {
        currentUserType = document.getElementById('userType').value;
        document.getElementById('volunteerFormContainer').style.display = (currentUserType === 'volunteer') ? 'block' : 'none';
        document.getElementById('ngoFormContainer').style.display = (currentUserType === 'ngo') ? 'block' : 'none';
        
        otpSection.style.display = 'none';
        messageEl.style.display = 'none';
        document.getElementById('getVolunteerOtpBtn').style.display = 'block';
        document.getElementById('getNgoOtpBtn').style.display = 'block';
    }

    /**
     * Handle OTP generation
     */
    async function handleGetOtp() {
        let phone;
        let btn;

        if (currentUserType === 'volunteer') {
            phone = document.getElementById('volunteerPhone').value.trim();
            btn = document.getElementById('getVolunteerOtpBtn');
        } else {
            phone = document.getElementById('ngoPhone').value.trim();
            btn = document.getElementById('getNgoOtpBtn');
        }

        if (!/^\d{10}$/.test(phone)) {
            showMessage("Please enter a valid 10-digit phone number.", 'error');
            return;
        }

        // Disable button and show loading
        btn.disabled = true;
        btn.textContent = 'Sending OTP...';
        messageEl.style.display = 'none';

        try {
            const response = await fetch('/api/volunteer/generate-otp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phoneNumber: phone })
            });
            
            const result = await response.json();

            if (result.success) {
                // Show OTP in alert for demo purposes
                alert(`(For Demo) Your OTP is: ${result.otp}`);
                
                showMessage('OTP sent successfully!', 'success');
                otpSection.style.display = 'block';
                btn.style.display = 'none';
            } else {
                showMessage(result.message || 'Failed to send OTP', 'error');
                btn.disabled = false;
                btn.textContent = 'Get OTP';
            }

        } catch (error) {
            console.error('OTP Error:', error);
            showMessage('Could not connect to the server. Please try again.', 'error');
            btn.disabled = false;
            btn.textContent = 'Get OTP';
        }
    }

    // Attach OTP button listeners
    document.getElementById('getVolunteerOtpBtn').addEventListener('click', handleGetOtp);
    document.getElementById('getNgoOtpBtn').addEventListener('click', handleGetOtp);

    /**
     * Handle OTP verification and login
     */
    document.getElementById('verifyBtn').addEventListener('click', async () => {
        const enteredOtp = document.getElementById('otp').value.trim();
        const btn = document.getElementById('verifyBtn');

        if (enteredOtp.length !== 6) {
             showMessage("Please enter a 6-digit OTP.", 'error');
             return;
        }

        // Build payload
        let payload = { 
            type: currentUserType,
            otp: enteredOtp
        };

        if (currentUserType === 'volunteer') {
            const fullName = document.getElementById('volunteerName').value.trim();
            const phoneNumber = document.getElementById('volunteerPhone').value.trim();
            
            if (!fullName) {
                showMessage("Please enter your full name.", 'error');
                return;
            }
            
            payload.fullName = fullName;
            payload.phoneNumber = phoneNumber;
        } else {
            const ngoName = document.getElementById('ngoName').value.trim();
            const registrationId = document.getElementById('ngoRegId').value.trim();
            const phoneNumber = document.getElementById('ngoPhone').value.trim();
            
            if (!ngoName || !registrationId) {
                showMessage("Please fill in all NGO details.", 'error');
                return;
            }
            
            payload.ngoName = ngoName;
            payload.registrationId = registrationId;
            payload.phoneNumber = phoneNumber;
        }

        btn.disabled = true;
        btn.textContent = 'Verifying...';
        
        try {
            const response = await fetch('/api/volunteer/verify-login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            
            const result = await response.json();

            if (result.success) {
                // Store user info
                sessionStorage.setItem('currentUserName', result.user.full_name);
                sessionStorage.setItem('currentUserInfo', JSON.stringify(result.user));

                showMessage(`${result.message} Redirecting...`, 'success');
                setTimeout(() => {
                    window.location.href = "volunteer-dashboard.html"; 
                }, 1500);
            } else {
                showMessage(`Login failed: ${result.message}`, 'error');
                btn.disabled = false;
                btn.textContent = 'Verify & Login';
            }
        } catch (error) {
            console.error('Login error:', error);
            showMessage('Could not connect to the server. Please try again.', 'error');
            btn.disabled = false;
            btn.textContent = 'Verify & Login';
        }
    });
</script>

    <footer>
        <p>© 2025 LifeLink | Saving Lives Together</p>
    </footer>

</body>
</html>
