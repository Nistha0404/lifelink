<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Volunteer & NGO Portal - LifeLink</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header>
        <div class="logo">
            <img src="lifeLinklogoD.png" alt="LifeLink Logo" height="40">
            <span>LifeLink</span>
        </div>
        <nav>
            <a href="../index.html">Home</a>
        </nav>
    </header>

    <main>
        <section class="main-card">
            <h2>Volunteer & NGO Portal</h2>
            <p>Register or log in to coordinate and save lives.</p>
            <br>

            <div class="form-group">
                <label for="userType">I am a/an:</label>
                <select id="userType" onchange="toggleRegistrationForm()">
                    <option value="volunteer">Individual Volunteer</option>
                    <option value="ngo">NGO / Organization</option>
                </select>
            </div>

            <div id="volunteerFormContainer">
                <form id="volunteerLoginForm">
                    <div class="form-group">
                        <label for="volunteerName">Full Name</label>
                        <input type="text" id="volunteerName" placeholder="Enter your full name" required>
                    </div>
                    <div class="form-group">
                        <label for="volunteerPhone">Phone Number</label>
                        <input type="tel" id="volunteerPhone" placeholder="Enter 10-digit number for OTP" maxlength="10" required>
                    </div>
                    <button type="button" id="getVolunteerOtpBtn" class="btn-primary">Get OTP</button>
                </form>
            </div>

            <div id="ngoFormContainer" style="display:none;">
                <form id="ngoLoginForm">
                    <div class="form-group">
                        <label for="ngoName">Organization Name</label>
                        <input type="text" id="ngoName" placeholder="Enter the organization's name" required>
                    </div>
                     <div class="form-group">
                        <label for="ngoRegId">Registration ID</label>
                        <input type="text" id="ngoRegId" placeholder="Enter official registration ID" required>
                    </div>
                    <div class="form-group">
                        <label for="ngoPhone">Contact Phone</label>
                        <input type="tel" id="ngoPhone" placeholder="Enter 10-digit number for OTP" maxlength="10" required>
                    </div>
                    <button type="button" id="getNgoOtpBtn" class="btn-primary">Get OTP</button>
                </form>
            </div>
            
            <div id="otpSection" style="display:none; margin-top:20px;">
                <p>An OTP has been sent to your mobile number.</p>
                <div class="form-group">
                    <label for="otp">Enter OTP</label>
                    <input type="text" id="otp" placeholder="Enter 4-digit OTP" maxlength="4">
                </div>
                <button type="button" id="verifyBtn" class="btn-primary">Verify & Login</button>
            </div>

            <p id="message" style="margin-top: 15px; font-weight: bold;"></p>
        </section>
    </main>

    <footer>
        <p>© 2025 LifeLink</p>
    </footer>

    <script>
        let generatedOtp = null;
        let currentUserType = 'volunteer';

        const messageEl = document.getElementById('message');
        const otpSection = document.getElementById('otpSection');

        function toggleRegistrationForm() {
            currentUserType = document.getElementById('userType').value;
            document.getElementById('volunteerFormContainer').style.display = (currentUserType === 'volunteer') ? 'block' : 'none';
            document.getElementById('ngoFormContainer').style.display = (currentUserType === 'ngo') ? 'block' : 'none';
            
            otpSection.style.display = 'none';
            messageEl.textContent = '';
            document.getElementById('getVolunteerOtpBtn').style.display = 'block';
            document.getElementById('getNgoOtpBtn').style.display = 'block';
        }

        function handleGetOtp() {
            let phone;
            if (currentUserType === 'volunteer') {
                phone = document.getElementById('volunteerPhone').value.trim();
            } else {
                phone = document.getElementById('ngoPhone').value.trim();
            }

            if (!/^\d{10}$/.test(phone)) {
                messageEl.style.color = 'var(--error-color)';
                messageEl.textContent = "Please enter a valid 10-digit phone number.";
                return;
            }

            generatedOtp = Math.floor(1000 + Math.random() * 9000);
            messageEl.style.color = 'var(--success-color)';
            messageEl.textContent = `(For Demo) Your OTP is: ${generatedOtp}`;
            
            otpSection.style.display = 'block';
            document.getElementById('getVolunteerOtpBtn').style.display = 'none';
            document.getElementById('getNgoOtpBtn').style.display = 'none';
        }

        document.getElementById('getVolunteerOtpBtn').addEventListener('click', handleGetOtp);
        document.getElementById('getNgoOtpBtn').addEventListener('click', handleGetOtp);

        document.getElementById('verifyBtn').addEventListener('click', async () => {
            const enteredOtp = document.getElementById('otp').value;
            if (enteredOtp != generatedOtp) {
                messageEl.style.color = 'var(--error-color)';
                messageEl.textContent = "Invalid OTP. Please try again.";
                return;
            }

            let payload = { type: currentUserType };
            if (currentUserType === 'volunteer') {
                payload.fullName = document.getElementById('volunteerName').value.trim();
                payload.phoneNumber = document.getElementById('volunteerPhone').value.trim();
            } else {
                payload.ngoName = document.getElementById('ngoName').value.trim();
                payload.registrationId = document.getElementById('ngoRegId').value.trim();
                payload.phoneNumber = document.getElementById('ngoPhone').value.trim();
            }

            try {
                // --- CHANGED THIS LINE ---
                const response = await fetch('/api/server/auth/volunteer-ngo', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = await response.json();

                if (result.success) {
                    const name = (currentUserType === 'volunteer') ? result.user.full_name : result.user.ngo_name;
                    sessionStorage.setItem('currentUserName', name);
                    messageEl.style.color = 'var(--success-color)';
                    messageEl.textContent = "Login successful! Redirecting...";
                    setTimeout(() => {
                        window.location.href = "volunteer-dashboard.html"; 
                    }, 1500);
                } else {
                    messageEl.style.color = 'var(--error-color)';
                    messageEl.textContent = `Login failed: ${result.message}`;
                }
            } catch (error) {
                console.error('Login error:', error);
                messageEl.style.color = 'var(--error-color)';
                messageEl.textContent = 'Could not connect to the server.';
            }
        });
    </script>

    <footer>
        <p>© 2025 LifeLink</p>
    </footer>

</body>
</html>
