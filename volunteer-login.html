<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volunteer & NGO Portal - LifeLink</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    
    <style>
        .auth-page {
            min-height: 100vh;
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: var(--neutral-50);
        }
        
        .auth-sidebar {
            background: var(--gradient-primary);
            padding: var(--space-12);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            color: white;
            position: relative;
            overflow: hidden;
        }
        
        .auth-sidebar::before {
            content: '';
            position: absolute;
            top: -100px;
            right: -100px;
            width: 300px;
            height: 300px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            z-index: 0;
        }
        
        .auth-sidebar::after {
            content: '';
            position: absolute;
            bottom: -150px;
            left: -100px;
            width: 400px;
            height: 400px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 45%;
            z-index: 0;
        }
        
        .auth-sidebar-content {
            position: relative;
            z-index: 1;
        }
        
        .auth-logo {
            font-family: var(--font-display);
            font-size: var(--font-2xl);
            font-weight: 700;
        }
        
        .auth-quote {
            font-size: var(--font-xl);
            font-weight: 500;
            line-height: 1.5;
            max-width: 400px;
        }
        
        .auth-main {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--space-10);
        }
        
        .auth-card {
            width: 100%;
            max-width: 450px;
            background: white;
            padding: var(--space-8) var(--space-10);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-lg);
        }
        
        .auth-title {
            font-family: var(--font-display);
            font-size: var(--font-2xl);
            font-weight: 700;
            color: var(--neutral-800);
            text-align: center;
            margin-bottom: var(--space-2);
        }
        
        .auth-subtitle {
            font-size: var(--font-base);
            color: var(--neutral-500);
            text-align: center;
            margin-bottom: var(--space-8);
        }
        
        .auth-tabs {
            display: flex;
            gap: var(--space-2);
            background: var(--neutral-100);
            padding: var(--space-1);
            border-radius: var(--radius-lg);
            margin-bottom: var(--space-6);
        }
        
        .auth-tab {
            flex: 1;
            padding: var(--space-3);
            border-radius: var(--radius-md);
            font-size: var(--font-sm);
            font-weight: 600;
            color: var(--neutral-600);
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .auth-tab.active {
            background: white;
            color: var(--primary-600);
            box-shadow: var(--shadow-sm);
        }
        
        .auth-form {
            display: none;
        }
        
        .auth-form.active {
            display: block;
        }
        
        .form-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: var(--space-5);
        }
        
        .otp-group {
            display: none; /* Hidden by default */
            gap: var(--space-4);
        }
        
        .phone-group {
            display: flex;
            gap: var(--space-3);
        }
        
        .phone-group input {
            flex: 1;
        }
        
        .phone-group button {
            flex-shrink: 0;
            white-space: nowrap;
        }
        
        #login-message {
            display: none;
            margin-top: var(--space-6);
        }
        
        @media (max-width: 900px) {
            .auth-page {
                grid-template-columns: 1fr;
            }
            .auth-sidebar {
                display: none; /* Hide sidebar on mobile */
            }
            .auth-main {
                background: var(--gradient-primary); /* Show gradient on mobile */
                padding: var(--space-6);
                min-height: 100vh;
            }
            .auth-card {
                padding: var(--space-8);
            }
        }
    </style>
</head>
<body>

    <div class="auth-page">
        <div class="auth-sidebar">
            <div class="auth-sidebar-content">
                <div class="auth-logo">LifeLink</div>
            </div>
            <div class="auth-sidebar-content">
                <p class="auth-quote">"The gift of blood is a gift of life. Thank you for being the bridge between a hope and a prayer."</p>
            </div>
        </div>
        
        <main class="auth-main">
            <div class="auth-card">
                <h1 class="auth-title">Volunteer & NGO Portal</h1>
                <p class="auth-subtitle">Access your dashboard to get started.</p>
                
                <div class="auth-tabs">
                    <div class="auth-tab active" data-tab="volunteer">Volunteer</div>
                    <div class="auth-tab" data-tab="ngo">NGO</div>
                </div>
                
                <div id="login-message" class="message"></div>

                <form class="auth-form active" id="form-volunteer" data-type="volunteer">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="v-fullname">Full Name</label>
                            <input type="text" id="v-fullname" placeholder="e.g., Anjali Sharma">
                        </div>
                        
                        <div class="form-group">
                            <label for="v-phone">Phone Number</label>
                            <div class="phone-group">
                                <input type="tel" id="v-phone" placeholder="98XXXXXX00">
                                <button type="button" class="button button-secondary" id="get-v-otp-btn">Get OTP</button>
                            </div>
                        </div>
                        
                        <div class="otp-group" id="v-otp-group">
                            <div class="form-group">
                                <label for="v-otp">Enter 6-Digit OTP</label>
                                <input type="tel" id="v-otp" placeholder="123456" maxlength="6">
                            </div>
                            <button type="submit" class="button button-primary" id="v-verify-btn" style="width: 100%;">Verify & Login</button>
                        </div>
                    </div>
                </form>
                
                <form class="auth-form" id="form-ngo" data-type="ngo">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="n-fullname">Your Full Name (Contact Person)</label>
                            <input type="text" id="n-fullname" placeholder="e.g., Rohan Gupta">
                        </div>
                        
                        <div class="form-group">
                            <label for="n-ngo-name">NGO Name</label>
                            <input type="text" id="n-ngo-name" placeholder="e.g., Helping Hands Foundation">
                        </div>
                        
                        <div class="form-group">
                            <label for="n-ngo-id">NGO Registration ID</label>
                            <input type="text" id="n-ngo-id" placeholder="e.g., NGO/123/ABC">
                        </div>

                        <div class="form-group">
                            <label for="n-phone">Your Phone Number</label>
                            <div class="phone-group">
                                <input type="tel" id="n-phone" placeholder="98XXXXXX00">
                                <button type="button" class="button button-secondary" id="get-n-otp-btn">Get OTP</button>
                            </div>
                        </div>
                        
                        <div class="otp-group" id="n-otp-group">
                            <div class="form-group">
                                <label for="n-otp">Enter 6-Digit OTP</label>
                                <input type="tel" id="n-otp" placeholder="123456" maxlength="6">
                            </div>
                            <button type="submit" class="button button-primary" id="n-verify-btn" style="width: 100%;">Verify & Login</button>
                        </div>
                    </div>
                </form>

            </div>
        </main>
    </div>
    
    
    <script>
    // Config
    const API_BASE_URL = ''; // Use relative path for Vercel
    let currentUserType = 'volunteer'; // Default
    
    // --- DOM Elements ---
    const tabs = document.querySelectorAll('.auth-tab');
    const forms = document.querySelectorAll('.auth-form');
    const messageEl = document.getElementById('login-message');
    
    // Volunteer Form Elements
    const volunteerForm = document.getElementById('form-volunteer');
    const vFullNameInput = document.getElementById('v-fullname');
    const vPhoneInput = document.getElementById('v-phone');
    const vOtpGroup = document.getElementById('v-otp-group');
    const vOtpInput = document.getElementById('v-otp');
    const getVolunteerOtpBtn = document.getElementById('get-v-otp-btn');
    
    // NGO Form Elements
    const ngoForm = document.getElementById('form-ngo');
    const nFullNameInput = document.getElementById('n-fullname');
    const nNgoNameInput = document.getElementById('n-ngo-name');
    const nNgoIdInput = document.getElementById('n-ngo-id');
    const nPhoneInput = document.getElementById('n-phone');
    const nOtpGroup = document.getElementById('n-otp-group');
    const nOtpInput = document.getElementById('n-otp');
    const getNgoOtpBtn = document.getElementById('get-n-otp-btn');

    // --- Tab Switching Logic ---
    tabs.forEach(tab => {
        tab.addEventListener('click', () => {
            // Update active tab
            tabs.forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            
            // Update active form
            currentUserType = tab.dataset.tab;
            forms.forEach(f => f.classList.remove('active'));
            document.getElementById(`form-${currentUserType}`).classList.add('active');
            
            // Hide messages
            messageEl.style.display = 'none';
        });
    });

    // --- Helper Functions ---
    function showMessage(message, type = 'error') {
        messageEl.textContent = message;
        messageEl.className = `message ${type}`;
        messageEl.style.display = 'block';
    }

    function validatePhone(phone) {
        return /^[6-9]\d{9}$/.test(phone);
    }
    
    function getActiveFormElements() {
        if (currentUserType === 'volunteer') {
            return {
                form: volunteerForm,
                phoneInput: vPhoneInput,
                otpGroup: vOtpGroup,
                otpInput: vOtpInput,
                getOtpBtn: getVolunteerOtpBtn,
                verifyBtn: document.getElementById('v-verify-btn'),
                payload: {
                    fullName: vFullNameInput.value.trim(),
                    phoneNumber: vPhoneInput.value.trim(),
                }
            };
        } else {
            return {
                form: ngoForm,
                phoneInput: nPhoneInput,
                otpGroup: nOtpGroup,
                otpInput: nOtpInput,
                getOtpBtn: getNgoOtpBtn,
                verifyBtn: document.getElementById('n-verify-btn'),
                payload: {
                    fullName: nFullNameInput.value.trim(),
                    ngoName: nNgoNameInput.value.trim(),
                    registrationId: nNgoIdInput.value.trim(),
                    phoneNumber: nPhoneInput.value.trim(),
                }
            };
        }
    }

    // --- Event Handlers ---

    // 1. Handle "Get OTP"
    async function handleGetOtp(e) {
        e.preventDefault();
        const { phoneInput, getOtpBtn, otpGroup, payload } = getActiveFormElements();
        const phone = payload.phoneNumber;

        // Basic Validation
        if (!payload.fullName) {
            return showMessage('Please enter your full name.');
        }
        if (currentUserType === 'ngo' && (!payload.ngoName || !payload.registrationId)) {
            return showMessage('Please fill in all NGO details.');
        }
        if (!validatePhone(phone)) {
            return showMessage('Please enter a valid 10-digit phone number.');
        }
        
        // --- API Call to Get OTP ---
        getOtpBtn.disabled = true;
        getOtpBtn.textContent = 'Sending...';
        // showMessage('Sending OTP...', 'info'); // <-- This was removed
        
        try {
            const response = await fetch(`${API_BASE_URL}/api/volunteer-login-otp`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    phoneNumber: phone,
                    type: currentUserType
                })
            });
            
            const result = await response.json();
            
            if (result.success) {
                // *** THIS IS THE CHANGE ***
                // Display the successful OTP message as an alert
                alert(result.message); 
                // *** END OF CHANGE ***
                
                otpGroup.style.display = 'grid'; // Show OTP field and login button
                phoneInput.disabled = true; // Lock phone input
                getOtpBtn.textContent = 'OTP Sent';
            } else {
                showMessage(result.message, 'error'); // Show errors normally
                getOtpBtn.disabled = false;
                getOtpBtn.textContent = 'Get OTP';
            }
        } catch (error) {
            console.error('Get OTP Error:', error);
            showMessage('Could not connect to the server. Please try again.', 'error'); // Show errors normally
            getOtpBtn.disabled = false;
            getOtpBtn.textContent = 'Get OTP';
        }
    }

    // 2. Handle "Verify & Login" (Form Submission)
    [volunteerForm, ngoForm].forEach(form => {
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const { verifyBtn, otpInput, payload } = getActiveFormElements();
            const otp = otpInput.value;
            const phone = payload.phoneNumber;
            
            // Validation
            if (!otp || otp.length !== 6) {
                return showMessage('Please enter the 6-digit OTP.');
            }
            
            verifyBtn.disabled = true;
            verifyBtn.textContent = 'Verifying...';
            
            const { fullName, ngoName, registrationId } = payload;
            
            try {
                const response = await fetch(`${API_BASE_URL}/api/volunteer-verify-otp`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        phoneNumber: phone,
                        fullName: fullName,
                        ngoName: ngoName,
                        registrationId: registrationId,
                        type: currentUserType,
                        otp: otp
                    })
                });

                const result = await response.json();

                if (result.success) {
                    sessionStorage.setItem('currentUser', JSON.stringify(result.user));
                    showMessage('Login successful! Redirecting...', 'success');
                    setTimeout(() => {
                        window.location.href = 'volunteer-dashboard.html';
                    }, 1500);
                } else {
                    showMessage(`Login failed: ${result.message}`, 'error');
                    verifyBtn.disabled = false;
                    verifyBtn.textContent = 'Verify & Login';
                }
            } catch (error) {
                console.error('Verification Error:', error);
                showMessage('Could not connect to the server. Please try again.', 'error');
                verifyBtn.disabled = false;
                verifyBtn.textContent = 'Verify & Login';
            }
        });
    });

    // Attach event listeners
    getVolunteerOtpBtn.addEventListener('click', handleGetOtp);
    getNgoOtpBtn.addEventListener('click', handleGetOtp);
    </script>
</body>
</html>
